<text x="115" y="355" font-size="19" font-weight="bold" text-anchor="start" fill="#111111">nested chains</text>
<text x="115" y="390" font-size="19" font-weight="normal" text-anchor="start" fill="#111111">A_s = (s+1)^k - s^k</text>
<text x="115" y="425" font-size="22" font-weight="bold" text-anchor="start" fill="#111111">≤ (2^k - 1)^s</text>
<text x="115" y="457" font-size="17" font-weight="normal" text-anchor="start" fill="#61666c">strict for k≥2, s≥2</text>
