<text x="50" y="55" font-size="34" font-weight="bold" text-anchor="start" fill="#111111">One layer hierarchy generates two stationary occupancy transitions</text>
<text x="50" y="88" font-size="19" font-weight="normal" text-anchor="start" fill="#61666c">Aggregate mode and stationary majority are distinct estimands</text>
<text x="45" y="145" font-size="28" font-weight="bold" text-anchor="start" fill="#111111">A</text>
<text x="85" y="145" font-size="24" font-weight="bold" text-anchor="start" fill="#111111">All lower layers reduce to one adjacent obstruction</text>
