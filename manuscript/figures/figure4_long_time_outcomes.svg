<text x="1395" y="669" font-size="18" font-weight="bold" text-anchor="middle" fill="#111111" style="">diagnostic theorem</text>
<rect x="85" y="720" width="1430" height="115" rx="10" fill="#f2f3f4" stroke="#111111" stroke-width="2"/>
<text x="300" y="758" font-size="20" font-weight="bold" text-anchor="middle" fill="#111111" style="">Stable real modes</text>
<text x="300" y="795" font-size="17" font-weight="normal" text-anchor="middle" fill="#111111" style="">may admit φ = r₁, α = r₂ ⇒ G = 0</text>
<text x="800" y="758" font-size="20" font-weight="bold" text-anchor="middle" fill="#111111" style="">Model-compatible complex mode</text>
<text x="800" y="795" font-size="17" font-weight="normal" text-anchor="middle" fill="#111111" style="">0 ≤ T &lt; 2 and discriminant &lt; 0 ⇒ every feasible decomposition has G &gt; 0</text>
<text x="1320" y="758" font-size="20" font-weight="bold" text-anchor="middle" fill="#111111" style="">Outside trace domain</text>
<text x="1320" y="795" font-size="17" font-weight="normal" text-anchor="middle" fill="#111111" style="">T &lt; 0 or T ≥ 2 ⇒ model incompatible</text>
<text x="800" y="875" font-size="20" font-weight="bold" text-anchor="middle" fill="#111111" style="">Cancellation and restoration can both look like stasis over long windows, but only restoration erases perturbations.</text>
