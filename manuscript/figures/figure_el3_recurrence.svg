<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.sub{fill:#62676c}.box{fill:#f4f5f6;stroke:#111;stroke-width:2}.axis{stroke:#111;stroke-width:2}.muted{stroke:#777;stroke-width:2}</style>
<rect width="1600" height="900" fill="white"/>
<text x="50" y="58" font-size="34" font-weight="700">Ecology filters structurally generated selection through time</text>
<text x="50" y="92" font-size="20" class="sub">Sufficient sensing architecture does not by itself determine long-run evolutionary effect.</text>

<text x="55" y="150" font-size="27" font-weight="700">A  One ecological state space carries both reward and recurrence</text>
<rect x="75" y="195" width="675" height="280" rx="16" class="box"/>
<circle cx="230" cy="330" r="72" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="230" y="320" font-size="21" font-weight="700" text-anchor="middle">community</text>
<text x="230" y="350" font-size="21" font-weight="700" text-anchor="middle">state i</text>
<line x1="302" y1="300" x2="430" y2="250" class="axis" marker-end="url(#a)"/>
<line x1="302" y1="360" x2="430" y2="410" class="axis" marker-end="url(#a)"/>
<rect x="440" y="205" width="250" height="100" rx="14" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="440" y="365" width="250" height="100" rx="14" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="565" y="242" font-size="20" font-weight="700" text-anchor="middle">finite sensing</text>
<text x="565" y="270" font-size="18" class="sub" text-anchor="middle">architecture → gᵢ → sᵢ</text>
<text x="565" y="402" font-size="20" font-weight="700" text-anchor="middle">transition operator P</text>
<text x="565" y="430" font-size="18" class="sub" text-anchor="middle">when the same sᵢ recurs</text>

<text x="825" y="150" font-size="27" font-weight="700">B  Slow ecological modes matter only when rewards align</text>
<rect x="840" y="195" width="685" height="280" rx="16" class="box"/>
<text x="905" y="235" font-size="19" font-weight="700">same slow mode</text>
<line x1="930" y1="415" x2="930" y2="270" class="axis"/>
<line x1="930" y1="415" x2="1165" y2="415" class="axis"/>
<path d="M945,380 C985,330 1025,285 1070,300 C1115,315 1130,365 1150,395" fill="none" stroke="#111" stroke-width="4"/>
<path d="M945,392 C995,386 1035,382 1085,388 C1120,392 1138,394 1150,397" fill="none" stroke="#777" stroke-width="3" stroke-dasharray="8 6"/>
<text x="1048" y="262" font-size="18" font-weight="700" text-anchor="middle">aligned reward</text>
<text x="1048" y="445" font-size="17" class="sub" text-anchor="middle">weakly aligned reward</text>
<line x1="1205" y1="270" x2="1205" y2="415" class="axis"/>
<line x1="1205" y1="415" x2="1460" y2="415" class="axis"/>
<rect x="1235" y="290" width="85" height="125" fill="#e9ebed" stroke="#111" stroke-width="2"/>
<rect x="1360" y="390" width="85" height="25" fill="#fff" stroke="#777" stroke-width="2"/>
<text x="1277" y="270" font-size="17" font-weight="700" text-anchor="middle">large</text>
<text x="1402" y="370" font-size="17" class="sub" text-anchor="middle">small</text>
<text x="1335" y="448" font-size="17" text-anchor="middle">contribution to σ²_eff</text>

<text x="55" y="555" font-size="27" font-weight="700">C  Spectral filtering separates ecological persistence from evolutionary effect</text>
<rect x="105" y="610" width="1390" height="170" rx="16" class="box"/>
<text x="800" y="665" font-size="28" font-weight="700" text-anchor="middle">σ²<tspan baseline-shift="sub" font-size="18">eff</tspan> = Σ<tspan baseline-shift="sub" font-size="18">r</tspan> w<tspan baseline-shift="sub" font-size="18">r</tspan> (1 + r<tspan baseline-shift="sub" font-size="18">r</tspan>) / (1 − r<tspan baseline-shift="sub" font-size="18">r</tspan>)</text>
<text x="800" y="715" font-size="20" text-anchor="middle">slow mode amplification × reward-mode alignment</text>
<text x="800" y="752" font-size="18" class="sub" text-anchor="middle">Persistence alone is insufficient: wᵣ must be large on the slow mode.</text>

<rect x="120" y="815" width="1360" height="60" rx="12" fill="#f4f5f6"/>
<text x="800" y="842" font-size="20" font-weight="700" text-anchor="middle">What organisms can distinguish bounds the available selection contrast;</text>
<text x="800" y="868" font-size="20" font-weight="700" text-anchor="middle">how ecological states recur determines which part of that contrast persists through time.</text>
</svg>
