<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.sub{fill:#62676c}.box{fill:#f4f5f6;stroke:#111;stroke-width:2}.axis{stroke:#111;stroke-width:2}.muted{stroke:#777;stroke-width:2}</style>
<rect width="1600" height="900" fill="white"/>
<text x="50" y="58" font-size="34" font-weight="700">Required feedback contrast forces a finite state-specific architecture</text>
<text x="50" y="92" font-size="20" class="sub">If Δg ≥ q and every state gap is nonnegative, at least one ecological state must support gᵢ ≥ q.</text>

<rect x="65" y="130" width="275" height="92" rx="14" class="box"/>
<rect x="435" y="130" width="275" height="92" rx="14" class="box"/>
<rect x="805" y="130" width="275" height="92" rx="14" class="box"/>
<rect x="1175" y="130" width="340" height="92" rx="14" class="box"/>
<text x="202" y="167" font-size="21" font-weight="700" text-anchor="middle">requested regime</text>
<text x="202" y="198" font-size="18" class="sub" text-anchor="middle">G &gt; Gₒₛc</text>
<text x="572" y="167" font-size="21" font-weight="700" text-anchor="middle">required contrast</text>
<text x="572" y="198" font-size="18" class="sub" text-anchor="middle">Δg ≥ q</text>
<text x="942" y="167" font-size="21" font-weight="700" text-anchor="middle">high-gap state</text>
<text x="942" y="198" font-size="18" class="sub" text-anchor="middle">some gᵢ ≥ q</text>
<text x="1345" y="167" font-size="21" font-weight="700" text-anchor="middle">finite architecture</text>
<text x="1345" y="198" font-size="18" class="sub" text-anchor="middle">(n, m, E) or Pareto set</text>
<line x1="340" y1="176" x2="425" y2="176" class="axis" marker-end="url(#a)"/>
<line x1="710" y1="176" x2="795" y2="176" class="axis" marker-end="url(#a)"/>
<line x1="1080" y1="176" x2="1165" y2="176" class="axis" marker-end="url(#a)"/>

<text x="55" y="285" font-size="27" font-weight="700">A  Binary sensing has an exact first gap-capable corner</text>
<rect x="75" y="330" width="595" height="280" rx="16" class="box"/>
<text x="372" y="378" font-size="24" font-weight="700" text-anchor="middle">required contrast q = 2</text>
<text x="372" y="414" font-size="18" class="sub" text-anchor="middle">⇒ at least one state needs gᵢ ≥ 2</text>
<text x="372" y="458" font-size="22" text-anchor="middle">h₂*(2) = 3</text>
<text x="372" y="508" font-size="28" font-weight="700" text-anchor="middle">(n*, m*, E*) = (6, 5, 5)</text>
<text x="372" y="548" font-size="18" class="sub" text-anchor="middle">represented alternatives  •  cue resources  •  irreducible obligations</text>
<text x="372" y="585" font-size="17" class="sub" text-anchor="middle">exact componentwise first corner for the required high-gap state</text>

<text x="745" y="285" font-size="27" font-weight="700">B  Smaller binary classes cannot supply enough contrast</text>
<rect x="770" y="330" width="745" height="280" rx="16" class="box"/>
<rect x="815" y="385" width="190" height="130" rx="14" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="1045" y="385" width="190" height="130" rx="14" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="1275" y="385" width="190" height="130" rx="14" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="910" y="425" font-size="22" font-weight="700" text-anchor="middle">n ≤ 5</text>
<text x="1140" y="425" font-size="22" font-weight="700" text-anchor="middle">m ≤ 4</text>
<text x="1370" y="425" font-size="22" font-weight="700" text-anchor="middle">E ≤ 4</text>
<text x="910" y="462" font-size="18" class="sub" text-anchor="middle">0 ≤ gᵢ ≤ 1</text>
<text x="1140" y="462" font-size="18" class="sub" text-anchor="middle">0 ≤ gᵢ ≤ 1</text>
<text x="1370" y="462" font-size="18" class="sub" text-anchor="middle">0 ≤ gᵢ ≤ 1</text>
<text x="910" y="498" font-size="35" font-weight="700" text-anchor="middle">×</text>
<text x="1140" y="498" font-size="35" font-weight="700" text-anchor="middle">×</text>
<text x="1370" y="498" font-size="35" font-weight="700" text-anchor="middle">×</text>
<text x="1142" y="555" font-size="19" font-weight="700" text-anchor="middle">If both states come from one such class, |Δg| ≤ 1.</text>
<text x="1142" y="585" font-size="17" class="sub" text-anchor="middle">So a regime requiring contrast q ≥ 2 is impossible.</text>

<text x="55" y="685" font-size="27" font-weight="700">C  Richer cues create a Pareto trade-off, not one scalar minimum</text>
<line x1="180" y1="835" x2="180" y2="715" class="axis"/>
<line x1="180" y1="835" x2="910" y2="835" class="axis"/>
<text x="545" y="878" font-size="18" text-anchor="middle">represented alternatives n</text>
<text x="128" y="780" font-size="18" text-anchor="middle" transform="rotate(-90 128 780)">cue / obligation burden</text>
<circle cx="470" cy="755" r="11" fill="#111"/>
<circle cx="675" cy="805" r="11" fill="#111"/>
<line x1="480" y1="762" x2="665" y2="798" class="muted" stroke-dasharray="7 6"/>
<text x="455" y="738" font-size="19" font-weight="700">(7,6,6)</text>
<text x="690" y="792" font-size="19" font-weight="700">(8,5,5)</text>
<text x="930" y="735" font-size="21" font-weight="700">Example: required contrast q = 3, b = 4</text>
<text x="930" y="775" font-size="18" class="sub">The high-gap state must support gap at least three.</text>
<text x="930" y="810" font-size="18" class="sub">Neither point dominates the other.</text>
<text x="930" y="845" font-size="18" class="sub">Arity trades cue burden against represented alternatives.</text>
</svg>
