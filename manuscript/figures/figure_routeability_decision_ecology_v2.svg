<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
<rect x="0" y="0" width="1600" height="950" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<text x="50" y="55" font-size="34" font-weight="bold" text-anchor="start" fill="#111111">When information accessibility becomes ecological</text>
<text x="50" y="88" font-size="19" font-weight="normal" text-anchor="start" fill="#666666">Finite budgets and temporal predictability expose conditional decision structure.</text>
<text x="45" y="135" font-size="28" font-weight="bold" text-anchor="start" fill="#111111">A</text>
<text x="85" y="135" font-size="24" font-weight="bold" text-anchor="start" fill="#111111">Finite ecological budget</text>
<line x1="90" y1="250" x2="610" y2="250" stroke="#222222" stroke-width="3"/>
<line x1="275" y1="234" x2="275" y2="266" stroke="#222222" stroke-width="2"/>
<text x="275" y="222" font-size="18" font-weight="bold" text-anchor="middle" fill="#111111">C_A</text>
<line x1="470" y1="234" x2="470" y2="266" stroke="#222222" stroke-width="2"/>
<text x="470" y="222" font-size="18" font-weight="bold" text-anchor="middle" fill="#111111">C_F</text>
<rect x="95" y="300" width="170" height="75" rx="6" fill="#f6f6f6" stroke="#bbbbbb" stroke-width="1"/>
<rect x="275" y="300" width="185" height="75" rx="6" fill="#e9e9e9" stroke="#777777" stroke-width="1"/>
<rect x="470" y="300" width="130" height="75" rx="6" fill="#f6f6f6" stroke="#bbbbbb" stroke-width="1"/>
<text x="180" y="330" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">B &lt; C_A</text>
<text x="180" y="355" font-size="15" font-weight="normal" text-anchor="middle" fill="#555555">neither guaranteed</text>
<text x="367" y="330" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">C_A ≤ B &lt; C_F</text>
<text x="367" y="355" font-size="15" font-weight="normal" text-anchor="middle" fill="#555555">contingent-only window</text>
<text x="535" y="330" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">B ≥ C_F</text>
<text x="535" y="355" font-size="15" font-weight="normal" text-anchor="middle" fill="#555555">both feasible</text>
<text x="350" y="420" font-size="16" font-weight="normal" text-anchor="middle" fill="#555555">time • exposure • handling opportunity • acquisition reward cost</text>
<text x="680" y="135" font-size="28" font-weight="bold" text-anchor="start" fill="#111111">B</text>
<text x="720" y="135" font-size="24" font-weight="bold" text-anchor="start" fill="#111111">Temporal routing and one quantified example</text>
<text x="710" y="175" font-size="18" font-weight="bold" text-anchor="start" fill="#111111">B1  Temporal predictive routing</text>
<line x1="730" y1="430" x2="1095" y2="430" stroke="#222222" stroke-width="2"/>
<line x1="730" y1="430" x2="730" y2="210" stroke="#222222" stroke-width="2"/>
<text x="785" y="454" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">rho=0</text>
<text x="915" y="454" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">rho=0.5</text>
<text x="1045" y="454" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">rho=1</text>
<circle cx="785" cy="230" r="7" fill="#111111" stroke="#111111" stroke-width="2"/>
<circle cx="915" cy="430" r="7" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<circle cx="1045" cy="230" r="7" fill="#111111" stroke="#111111" stroke-width="2"/>
<polyline points="785,230 915,430 1045,230" fill="none" stroke="#111111" stroke-width="3"/>
<text x="785" y="216" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111">gain 0.25</text>
<text x="915" y="414" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111">gain 0</text>
<text x="1045" y="216" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111">gain 0.25</text>
<text x="785" y="275" font-size="13" font-weight="normal" text-anchor="middle" fill="#555555">predictable alternation</text>
<text x="915" y="390" font-size="13" font-weight="normal" text-anchor="middle" fill="#555555">temporal independence</text>
<text x="1045" y="275" font-size="13" font-weight="normal" text-anchor="middle" fill="#555555">predictable persistence</text>
<text x="910" y="485" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">G_time = |2rho - 1| / 4</text>
<text x="1140" y="175" font-size="18" font-weight="bold" text-anchor="start" fill="#111111">B2  Spaethe et al. 2026</text>
<rect x="1160" y="220" width="160" height="210" rx="5" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/>
<rect x="1370" y="220" width="160" height="210" rx="5" fill="#ededed" stroke="#777777" stroke-width="1"/>
<text x="1240" y="250" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">Easy primary cue</text>
<text x="1450" y="250" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">Hard primary cue</text>
<rect x="1210" y="385.3625" width="60" height="9.6375" rx="2" fill="#bbbbbb" stroke="#777777" stroke-width="1"/>
<rect x="1420" y="254.6375" width="60" height="140.3625" rx="2" fill="#444444" stroke="#222222" stroke-width="1"/>
<text x="1240" y="420" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">R = 0.026</text>
<text x="1450" y="420" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">R = 0.374</text>
<text x="1345" y="465" font-size="15" font-weight="normal" text-anchor="middle" fill="#555555">secondary-cue recruitment</text>
<text x="1345" y="490" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">pooled Cliff's δ = 0.980</text>
<text x="680" y="545" font-size="18" font-weight="bold" text-anchor="start" fill="#111111">B3</text>
<text x="720" y="545" font-size="18" font-weight="bold" text-anchor="start" fill="#111111">Parallel staged decisions</text>
<rect x="710" y="570" width="250" height="110" rx="8" fill="#ffffff" stroke="#aaaaaa" stroke-width="1"/>
<text x="835" y="600" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">Parasitoid host finding</text>
<text x="835" y="630" font-size="14" font-weight="normal" text-anchor="middle" fill="#555555">host habitat</text>
<text x="835" y="652" font-size="14" font-weight="normal" text-anchor="middle" fill="#555555">then host assessment</text>
<rect x="995" y="570" width="250" height="110" rx="8" fill="#ffffff" stroke="#aaaaaa" stroke-width="1"/>
<text x="1120" y="600" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">Fiddler crab</text>
<text x="1120" y="630" font-size="14" font-weight="normal" text-anchor="middle" fill="#555555">multi-stage</text>
<text x="1120" y="652" font-size="14" font-weight="normal" text-anchor="middle" fill="#555555">predator assessment</text>
<rect x="1280" y="570" width="250" height="110" rx="8" fill="#ffffff" stroke="#aaaaaa" stroke-width="1"/>
<text x="1405" y="600" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">Patch foraging</text>
<text x="1405" y="630" font-size="14" font-weight="normal" text-anchor="middle" fill="#555555">repeated stay / leave</text>
<text x="1405" y="652" font-size="14" font-weight="normal" text-anchor="middle" fill="#555555">decisions</text>
<text x="45" y="530" font-size="28" font-weight="bold" text-anchor="start" fill="#111111">C</text>
<text x="85" y="530" font-size="24" font-weight="bold" text-anchor="start" fill="#111111">Prospective full routeability test</text>
<rect x="75" y="575" width="520" height="105" rx="10" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="335" y="608" font-size="19" font-weight="bold" text-anchor="middle" fill="#111111">same physical cue matrix</text>
<text x="335" y="638" font-size="18" font-weight="normal" text-anchor="middle" fill="#555555">different action-conditioned branch structure</text>
<text x="335" y="665" font-size="18" font-weight="normal" text-anchor="middle" fill="#555555">costly cue acquisition + shared finite budget</text>
<text x="100" y="730" font-size="17" font-weight="bold" text-anchor="start" fill="#111111">Predicted architecture × access contrast</text>
<line x1="160" y1="850" x2="160" y2="760" stroke="#bbbbbb" stroke-width="1"/>
<circle cx="160" cy="845" r="10" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="160" y="880" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">B=1</text>
<line x1="330" y1="850" x2="330" y2="760" stroke="#bbbbbb" stroke-width="1"/>
<circle cx="330" cy="775" r="10" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="330" y="880" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">B=2</text>
<line x1="500" y1="850" x2="500" y2="760" stroke="#bbbbbb" stroke-width="1"/>
<circle cx="500" cy="845" r="10" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="500" y="880" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">B=3</text>
<text x="330" y="795" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">routeability-sensitive</text>
<text x="330" y="815" font-size="14" font-weight="normal" text-anchor="middle" fill="#555555">middle-budget window</text>
<text x="680" y="735" font-size="28" font-weight="bold" text-anchor="start" fill="#111111">D</text>
<text x="720" y="735" font-size="24" font-weight="bold" text-anchor="start" fill="#111111">Measurement rule</text>
<rect x="710" y="780" width="125" height="58" rx="8" fill="#ffffff" stroke="#777777" stroke-width="1"/>
<text x="772.5" y="814" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">focal action</text>
<line x1="835" y1="809" x2="855" y2="809" stroke="#777777" stroke-width="2"/>
<rect x="855" y="780" width="125" height="58" rx="8" fill="#ffffff" stroke="#777777" stroke-width="1"/>
<text x="917.5" y="814" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">alternatives</text>
<line x1="980" y1="809" x2="1000" y2="809" stroke="#777777" stroke-width="2"/>
<rect x="1000" y="780" width="125" height="58" rx="8" fill="#ffffff" stroke="#777777" stroke-width="1"/>
<text x="1062.5" y="814" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">cue table</text>
<line x1="1125" y1="809" x2="1145" y2="809" stroke="#777777" stroke-width="2"/>
<rect x="1145" y="780" width="125" height="58" rx="8" fill="#ffffff" stroke="#777777" stroke-width="1"/>
<text x="1207.5" y="814" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">cue costs</text>
<line x1="1270" y1="809" x2="1290" y2="809" stroke="#777777" stroke-width="2"/>
<rect x="1290" y="780" width="125" height="58" rx="8" fill="#ffffff" stroke="#777777" stroke-width="1"/>
<text x="1352.5" y="814" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">C_A, C_F</text>
<line x1="1415" y1="809" x2="1435" y2="809" stroke="#777777" stroke-width="2"/>
<rect x="1435" y="780" width="125" height="58" rx="8" fill="#ededed" stroke="#777777" stroke-width="1"/>
<text x="1497.5" y="814" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">budget B</text>
<text x="1085" y="875" font-size="18" font-weight="bold" text-anchor="middle" fill="#111111">measure the action-conditioned cue table first; summarize it second</text>
<text x="800" y="938" font-size="19" font-weight="bold" text-anchor="middle" fill="#111111">Decision structure, not taxon identity, defines the accessibility problem.</text>
</svg>