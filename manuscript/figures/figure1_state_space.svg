<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111111"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<text x="50" y="55" font-size="34" font-weight="bold" text-anchor="start" fill="#111111" style="">One ecological state space generates both reward amplitude and recurrence</text>
<text x="45" y="110" font-size="28" font-weight="bold" text-anchor="start" fill="#111111" style="">A</text>
<text x="85" y="110" font-size="25" font-weight="bold" text-anchor="start" fill="#111111" style="">Contingent sensing can avoid fixed cue burden</text>
<text x="905" y="110" font-size="28" font-weight="bold" text-anchor="start" fill="#111111" style="">B</text>
<text x="945" y="110" font-size="25" font-weight="bold" text-anchor="start" fill="#111111" style="">The same ecological states determine recurrence</text>
<circle cx="215" cy="230" r="55" fill="#f2f3f4" stroke="#111111" stroke-width="2"/>
<text x="215" y="238" font-size="20" font-weight="bold" text-anchor="middle" fill="#111111" style="">coarse cue</text>
<line x1="195" y1="282" x2="120" y2="380" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="235" y1="282" x2="330" y2="380" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
<text x="80" y="350" font-size="16" font-weight="normal" text-anchor="start" fill="#60656b" style="">A branch</text>
<text x="285" y="350" font-size="16" font-weight="normal" text-anchor="start" fill="#60656b" style="">B branch</text>
<circle cx="105" cy="430" r="55" fill="#f2f3f4" stroke="#111111" stroke-width="2"/>
<text x="105" y="423" font-size="18" font-weight="bold" text-anchor="middle" fill="#111111" style="">fine cue A</text>
<text x="105" y="448" font-size="18" font-weight="bold" text-anchor="middle" fill="#111111" style="">A1 vs A2</text>
<circle cx="330" cy="430" r="55" fill="#f2f3f4" stroke="#111111" stroke-width="2"/>
<text x="330" y="423" font-size="18" font-weight="bold" text-anchor="middle" fill="#111111" style="">fine cue B</text>
<text x="330" y="448" font-size="18" font-weight="bold" text-anchor="middle" fill="#111111" style="">B1 vs B2</text>
<rect x="35" y="535" width="75" height="48" rx="10" fill="#f2f3f4" stroke="#111111" stroke-width="2"/>
<text x="72.5" y="566" font-size="18" font-weight="bold" text-anchor="middle" fill="#111111" style="">A1</text>
<rect x="140" y="535" width="75" height="48" rx="10" fill="#f2f3f4" stroke="#111111" stroke-width="2"/>
<text x="177.5" y="566" font-size="18" font-weight="bold" text-anchor="middle" fill="#111111" style="">A2</text>
<rect x="260" y="535" width="75" height="48" rx="10" fill="#f2f3f4" stroke="#111111" stroke-width="2"/>
<text x="297.5" y="566" font-size="18" font-weight="bold" text-anchor="middle" fill="#111111" style="">B1</text>
<rect x="365" y="535" width="75" height="48" rx="10" fill="#f2f3f4" stroke="#111111" stroke-width="2"/>
<text x="402.5" y="566" font-size="18" font-weight="bold" text-anchor="middle" fill="#111111" style="">B2</text>
<line x1="82" y1="482" x2="73" y2="535" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="128" y1="482" x2="177" y2="535" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="307" y1="482" x2="297" y2="535" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="352" y1="482" x2="402" y2="535" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="25" y="620" width="365" height="105" rx="10" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="207" y="654" font-size="22" font-weight="bold" text-anchor="middle" fill="#111111" style="">Adaptive path</text>
<text x="207" y="685" font-size="19" font-weight="normal" text-anchor="middle" fill="#60656b" style="">coarse cue + relevant fine cue</text>
<text x="207" y="715" font-size="19" font-weight="normal" text-anchor="middle" fill="#60656b" style="">C_A = 2</text>
<rect x="430" y="620" width="365" height="105" rx="10" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="612" y="654" font-size="22" font-weight="bold" text-anchor="middle" fill="#111111" style="">Fixed cue set</text>
<text x="612" y="685" font-size="19" font-weight="normal" text-anchor="middle" fill="#60656b" style="">must cover all branches</text>
<text x="612" y="715" font-size="19" font-weight="normal" text-anchor="middle" fill="#60656b" style="">C_F = 3</text>
<text x="410" y="610" font-size="15" font-weight="normal" text-anchor="middle" fill="#60656b" style="">compare</text>
<line x1="390" y1="605" x2="430" y2="605" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="195" y="745" width="430" height="72" rx="10" fill="#f2f3f4" stroke="#111111" stroke-width="2"/>
<text x="410" y="775" font-size="21" font-weight="bold" text-anchor="middle" fill="#111111" style="">structural gap  g = C_F − C_A = 1</text>
<text x="410" y="803" font-size="17" font-weight="normal" text-anchor="middle" fill="#60656b" style="">avoidable fixed burden under contingent sensing</text>
<circle cx="1080" cy="255" r="62" fill="#f2f3f4" stroke="#111111" stroke-width="2"/>
<text x="1080" y="263" font-size="20" font-weight="bold" text-anchor="middle" fill="#111111" style="">state 1</text>
<circle cx="1340" cy="230" r="62" fill="#f2f3f4" stroke="#111111" stroke-width="2"/>
<text x="1340" y="238" font-size="20" font-weight="bold" text-anchor="middle" fill="#111111" style="">state 2</text>
<circle cx="1450" cy="485" r="62" fill="#f2f3f4" stroke="#111111" stroke-width="2"/>
<text x="1450" y="493" font-size="20" font-weight="bold" text-anchor="middle" fill="#111111" style="">state 3</text>
<circle cx="1165" cy="535" r="62" fill="#f2f3f4" stroke="#111111" stroke-width="2"/>
<text x="1165" y="543" font-size="20" font-weight="bold" text-anchor="middle" fill="#111111" style="">state 4</text>
<line x1="1142" y1="250" x2="1278" y2="235" stroke="#60656b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1370" y1="285" x2="1422" y2="420" stroke="#60656b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1388" y1="500" x2="1225" y2="530" stroke="#60656b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1137" y1="475" x2="1095" y2="318" stroke="#60656b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1125" y1="292" x2="1397" y2="445" stroke="#60656b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1305" y1="285" x2="1200" y2="478" stroke="#60656b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1280" y="400" font-size="22" font-weight="bold" text-anchor="middle" fill="#111111" style="">transition operator P</text>
<line x1="1280" y1="598" x2="1280" y2="655" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="950" y="660" width="585" height="125" rx="10" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="1242" y="695" font-size="22" font-weight="bold" text-anchor="middle" fill="#111111" style="">Shared downstream state coordinates</text>
<text x="1242" y="730" font-size="19" font-weight="normal" text-anchor="middle" fill="#60656b" style="">finite sensing structure → g_i → s_i = λg_i − κ</text>
<text x="1242" y="760" font-size="19" font-weight="normal" text-anchor="middle" fill="#60656b" style="">state transitions P → recurrence of the same s_i</text>
<text x="800" y="865" font-size="22" font-weight="bold" text-anchor="middle" fill="#111111" style="">Natural history declares alternatives, cues and distinctions; theory constrains the dynamics they can support.</text>
</svg>