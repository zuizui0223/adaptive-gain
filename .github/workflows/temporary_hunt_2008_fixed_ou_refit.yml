name: temporary-hunt-2008-fixed-ou-refit

on:
  push:
    branches:
      - analysis/evoTS-moving-optimum-audit

jobs:
  refit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
      - name: Install pinned paleoTS source
        shell: bash
        run: |
          Rscript -e 'install.packages(c("mnormt","foreach","doParallel"), repos="https://cloud.r-project.org")'
          git clone https://github.com/cran/paleoTS.git /tmp/paleoTS
          git -C /tmp/paleoTS checkout 6fbc4f6fa35ef2c7de73e11b9f6dda8ba73e7bc6
          R CMD INSTALL /tmp/paleoTS
      - name: Refit Hunt 2008 dorsal-spine series and verify reciprocal witness
        shell: Rscript {0}
        run: |
          library(paleoTS)
          cat("PALEOTS_VERSION=", as.character(packageVersion("paleoTS")), "\n", sep="")
          data(dorsal.spines)
          ok1 <- dorsal.spines$nn > 0
          ok2 <- dorsal.spines$tt > 4.4
          ds.sub <- sub.paleoTS(dorsal.spines, ok = ok1 & ok2, reset.time = TRUE)
          ds.sub.pool <- pool.var(ds.sub, minN = 5, ret.paleoTS = TRUE)
          w.ou <- fitSimple(ds.sub.pool, pool = FALSE, model = "OU", method = "Joint")

          cat("N_RAW=", length(dorsal.spines$mm), "\n", sep="")
          cat("N_REFIT=", length(ds.sub.pool$mm), "\n", sep="")
          cat("TT=", paste(format(ds.sub.pool$tt, digits=17, scientific=FALSE, trim=TRUE), collapse=","), "\n", sep="")
          cat("MM=", paste(format(ds.sub.pool$mm, digits=17, scientific=FALSE, trim=TRUE), collapse=","), "\n", sep="")
          cat("SAMPLING_VAR=", paste(format(ds.sub.pool$vv/ds.sub.pool$nn, digits=17, scientific=FALSE, trim=TRUE), collapse=","), "\n", sep="")
          cat("FIT_NAMES=", paste(names(w.ou), collapse=","), "\n", sep="")
          cat("PARAM_NAMES=", paste(names(w.ou$parameters), collapse=","), "\n", sep="")
          cat("PARAMETERS=", paste(format(unname(w.ou$parameters), digits=17, scientific=FALSE, trim=TRUE), collapse=","), "\n", sep="")
          cat("LOGL=", format(w.ou$logL, digits=17), "\n", sep="")
          cat("AICC=", format(w.ou$AICc, digits=17), "\n", sep="")
          cat("K=", w.ou$K, "\n", sep="")
          cat("N_FIT_OBJECT=", w.ou$n, "\n", sep="")

          p <- w.ou$parameters
          anc <- unname(p["anc"])
          vstep <- unname(p["vstep"])
          theta <- unname(p["theta"])
          alpha <- unname(p["alpha"])
          h <- log(2)/alpha
          cat("ANC=", format(anc, digits=17), "\n", sep="")
          cat("VSTEP=", format(vstep, digits=17), "\n", sep="")
          cat("THETA=", format(theta, digits=17), "\n", sep="")
          cat("ALPHA=", format(alpha, digits=17), "\n", sep="")
          cat("HALF_LIFE_NATIVE=", format(h, digits=17), "\n", sep="")

          # q=1/2 reciprocal realization from the exact fixed-OU congruence.
          q <- 0.5
          a <- q * alpha
          d <- (1-q) * alpha
          y0 <- (alpha * theta - d * anc) / a
          sx <- sqrt(vstep)
          tt <- ds.sub.pool$tt

          source_mean <- theta + (anc-theta) * exp(-alpha * tt)
          rec_mean <- vapply(tt, function(t) {
            z <- (1-exp(-alpha*t))/alpha
            left <- 1-a*z
            right <- a*z
            left*anc + right*y0
          }, numeric(1))

          source_cov <- outer(tt, tt, Vectorize(function(s,t) {
            m <- min(s,t)
            hh <- abs(t-s)
            vstep * (exp(-alpha*hh)-exp(-alpha*(hh+2*m))) / (2*alpha)
          }))

          kernel <- function(u) {
            z <- (1-exp(-alpha*u))/alpha
            left <- 1-a*z
            right <- a*z
            left*sx + right*(-d/a*sx)
          }
          rec_cov <- outer(tt, tt, Vectorize(function(s,t) {
            m <- min(s,t)
            if (m == 0) return(0)
            integrate(function(u) kernel(s-u)*kernel(t-u), lower=0, upper=m,
                      rel.tol=1e-12, abs.tol=1e-13)$value
          }))

          samp <- ds.sub.pool$vv/ds.sub.pool$nn
          diag(source_cov) <- diag(source_cov) + samp
          diag(rec_cov) <- diag(rec_cov) + samp

          cat("RECIP_Q=", q, "\n", sep="")
          cat("RECIP_A=", format(a, digits=17), "\n", sep="")
          cat("RECIP_D=", format(d, digits=17), "\n", sep="")
          cat("RECIP_Y0=", format(y0, digits=17), "\n", sep="")
          cat("RECIP_DIRECT_HALF_LIFE_NATIVE=", format(log(2)/a, digits=17), "\n", sep="")
          cat("MAX_ABS_MEAN_DIFF=", format(max(abs(source_mean-rec_mean)), digits=17, scientific=TRUE), "\n", sep="")
          cat("MAX_ABS_COV_DIFF=", format(max(abs(source_cov-rec_cov)), digits=17, scientific=TRUE), "\n", sep="")

          stopifnot(max(abs(source_mean-rec_mean)) < 1e-10)
          stopifnot(max(abs(source_cov-rec_cov)) < 1e-9)
