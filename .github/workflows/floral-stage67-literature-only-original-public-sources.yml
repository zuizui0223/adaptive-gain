name: floral-stage67-primary-literature-and-public-database-systematic-inventory
on:
  push:
    branches: [analysis/floral-literature-database-macro-systematic-stage67-20261117]
    paths:
      - 'research/floral_literature_macro_stage67/**'
      - '.github/workflows/floral-stage67-literature-only-original-public-sources.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  true-original-public-databases-not-iNat-photos:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit and ecological inferential status checks before public source retrieval
        run: python -m unittest discover -s research/floral_literature_macro_stage67 -p 'test_systematic_source_registry_and_pagination.py' -v
      - name: Run real 28-topic paginated Europe PMC metadata catalogue
        run: |
          python -u research/floral_literature_macro_stage67/systematic_source_europepmc_visual_and_multisensory.py \
            --output stage67_original_database_literature_inventory
      - name: Assert source query receipt + no hidden photo-based data
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('stage67_original_database_literature_inventory')
          r=json.loads((p/'original_EuropePMC_expanded_flower_information_query_receipt.json').read_text())
          with (p/'expanded_original_flower_sensory_literature_metadata_candidates.csv').open() as f:
            rows=list(csv.DictReader(f))
          assert r['n_prespecified_query_topics']==28
          assert r['n_source_queries_ok']>=20
          assert len(rows)==r['n_distinct_article_identifiers_not_species']
          assert r['no_abstract_count_misinterpreted_as_measured_plant_trait']
          assert r['no_claim_of_exhaustive_all_repositories_or_all_global_papers']
          assert all(z['trait_observation_status']=='NOT_READ_FROM_SOURCE_DATA' for z in rows)
          assert all(z['original_species_count_verified_from_this_index']=='UNKNOWN' for z in rows)
          print('STAGE67_28_TOPIC_SOURCE_ONLY_SYSTEMATIC_QUERY_VERIFIED',
                {'unique_article_identifiers':len(rows),
                 'success':r['n_source_queries_ok'],
                 'failure':r['n_source_queries_failed'],
                 'truncated_topic_count':r['n_source_queries_truncated_by_ceiling']})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage67-systematic-literature-not-photo-28topic-original-EuropePMC-query
          path: |
            stage67_original_database_literature_inventory/*
            research/floral_literature_macro_stage67/curated_original_floral_trait_pollinator_data_sources.json
          retention-days: 90
          if-no-files-found: error
