name: floral-stage49-original-42-species-paper-supplement-table
on:
  push:
    branches: [analysis/floral-literature-uv-taxonomic-atlas-stage49-20261116]
    paths:
      - 'research/floral_visual_macro_stage49/probe_current_biology_original_table_s1.py'
      - 'research/floral_visual_macro_stage49/extract_current_biology_table_s1.py'
      - '.github/workflows/floral-stage49-original-2020-paper-taxa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authentic-three-continent-UV-species-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF layout reader
        run: python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.3'
      - name: Verify real article PDF supplement and original 42-species Table S1 source text layout
        working-directory: research/floral_visual_macro_stage49
        run: python -u probe_current_biology_original_table_s1.py
      - name: Offline original article Table S1 species row parsing
        working-directory: research/floral_visual_macro_stage49
        run: python -m unittest -v test_extract_current_biology_table_s1
      - name: Extract published UV species and continent rows from exact original PDF
        working-directory: research/floral_visual_macro_stage49
        run: python -u extract_current_biology_table_s1.py
      - name: Prevent false UV-guide or source taxon denominator conclusions
        working-directory: research/floral_visual_macro_stage49
        run: |
          python - <<'PY'
          import json,csv
          from pathlib import Path
          p=Path('stage49_literature_species_registry')
          s=json.loads((p/'original_TableS1_source_coverage.json').read_text())
          assert s['status']=='SOURCE_PAPER_TABLE_S1_CONTINENT_BY_TAXON_UV_HERBARIUM_ROSTER'
          assert s['article_reports_42_species']
          assert s['article_reports_1238_herbarium_samples']
          assert s['do_not_treat_UVP_slope_as_UV_guide_presence']
          with (p/'koski_2020_current_biology_original_TableS1_taxon_continent_uvp.csv').open() as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==s['n_source_continent_by_taxon_rows']
          assert all(r['uv_nectar_guide_presence']=='NOT_MEASURED_OR_NOT_REPORTED_IN_S1'
                     for r in rows)
          print('STAGE49_AUTHENTIC_PAPER_SPECIES_ROSTER_QA',
                {k:s[k] for k in ('n_source_continent_by_taxon_rows',
                                  'n_unique_literal_published_binomials',
                                  'source_herbarium_samples_sum')})
          PY
      - name: Keep original 2021 UV category, 2020 temporal UVP, and unverified 177-study distinct
        working-directory: research/floral_visual_macro_stage49
        run: python -m unittest -v test_assemble_literature_visual_species
      - name: Build genuine 80 UV-category plus 2020 herbarium original-paper species evidence rows
        working-directory: research/floral_visual_macro_stage49
        run: python -u assemble_literature_visual_species.py
      - name: Verify original source cohorts without invented guide-positive taxa
        working-directory: research/floral_visual_macro_stage49
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,json
          p=Path('stage49_literature_species_registry')
          s=json.loads((p/'source_distinct_visual_modalities_receipt.json').read_text())
          assert s['status']=='TWO_AUTHENTIC_LITERATURE_VISUAL_SPECIES_FRAMES_WITH_DISTINCT_PHENOTYPE_MODALITIES'
          assert s['UV_photo_2021_original_80_rows']==80
          assert s['original_2020_continent_taxon_rows']==45
          assert s['original_2020_unique_literal_binomial_names']==41
          assert s['article_reported_2020_number_of_species']==42
          assert s['original_2020_herbarium_specimens']==1238
          assert s['original_2021_UV_patterned_taxon_rows']==26
          assert s['original_2020_spatial_UV_pattern_labels_NOT_available']
          assert s['no_measured_Bombus_overlap_or_pollination_fitness']
          with (p/'combined_original_papers_visual_trait_species_registry.csv').open() as h:
              rows=list(csv.DictReader(h))
          assert len(rows)==80+41
          assert all(r['source_pollination_status'] for r in rows)
          assert all(r['model_Bombus_geographic_link_status']=='NOT_YET_MATCHED_STUDY_SPECIES_TO_HEX' for r in rows)
          cb=[r for r in rows if r['original_study_doi']=='10.1016/j.cub.2020.08.077']
          assert len(cb)==41
          assert all(r['UV_spatial_guide_pattern_source_status']=='NOT_CLASSIFIED_BY_TABLE_S1' for r in cb)
          print('STAGE49_PUBLISHED_LITERATURE_SPECIES_REGISTRY_ACCEPTED',
                {'study_taxon_rows':len(rows),
                 'overlap_spelling_only':s['literal_cross_paper_binomial_string_overlap_n'],
                 'unique_binomial_candidates':s['combined_distinct_literal_source_binomial_candidates_n']})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage49-original-current-biology-42-species-paper-table-layout
          path: |
            research/floral_visual_macro_stage49/stage49_current_biology_source/*.json
            research/floral_visual_macro_stage49/stage49_literature_species_registry/*.json
            research/floral_visual_macro_stage49/stage49_literature_species_registry/*.csv
          if-no-files-found: error
          retention-days: 60
