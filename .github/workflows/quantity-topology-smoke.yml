name: quantity-topology-smoke

on:
  push:
    branches:
      - synthesis/balanced-routeability-ecology-v1
    paths:
      - "adaptive_gain/balanced_quantity_topology_contrast.py"
      - "adaptive_gain/balanced_pairwise_information_controls.py"
      - "tests/test_balanced_quantity_topology_contrast.py"
      - "tests/test_balanced_pairwise_information_controls.py"
      - ".github/workflows/quantity-topology-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_balanced_quantity_topology_contrast.py tests/test_balanced_pairwise_information_controls.py
