name: bee-stage18-asymmetric-info-stop-math
on:
  push:
    branches: [theory/bee-state-dependent-stop-stage18-20261111]
    paths:
      - 'research/bee_asymmetry_stage18/**'
      - '.github/workflows/bee-stage18-asymmetric-info-stop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source-free-asymmetry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare exact asymmetric root-branch stop rule to independent 8-state posterior optimizer
        working-directory: research/bee_asymmetry_stage18
        run: python -m unittest test_asymmetric_access -v
      - name: Freeze source-free exact benefit surface and iid mock world receipt
        working-directory: research/bee_asymmetry_stage18
        run: python -u asymmetric_access.py --out stage18_exact_outputs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bee-stage18-no-animals-asymmetric-access-math
          path: research/bee_asymmetry_stage18/stage18_exact_outputs/stage18_asymmetry_decision_surface.json
          if-no-files-found: warn
          retention-days: 90
