name: floral-stage72-real-original-field-spectra-VOC-visits-source-audit

on:
  push:
    branches: [analysis/floral-original-field-site-sensory-sources-stage72-20261117]
    paths:
      - 'research/floral_original_field_stage72/**'
      - '.github/workflows/floral-stage72-real-original-field-multimodal.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  primary-field-source-availability:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Mock-only archive and metadata provenance tests
        run: |
          python -m unittest discover -s research/floral_original_field_stage72 \
            -p 'test_audit_original_field_spectra_visits_sources.py' -v
      - name: Retrieve actual original Kantsa Figshare/Nature, Xie and Albor source metadata
        run: |
          python -u research/floral_original_field_stage72/audit_original_field_spectra_visits_sources.py \
            --outdir stage72_original_author_primary_source_audit
      - name: Assert source access status cannot become biological negatives
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("stage72_original_author_primary_source_audit/stage72_original_public_sources_access_and_workbook_schema.json").read_text())
          assert j["number_of_candidate_independent_geographic_study_regions"]==3
          assert j["no_photo_derived_trait_or_UV_guide_negative"]
          assert j["no_global_optical_effect_claimed"]
          assert j["n_actual_species_site_visitor_x_spectral_effects_extracted"]==0
          assert all(r.get("no_inferred_plant_species_or_visits",True) for r in j["source_receipts"])
          print("STAGE72_SOURCE_RETRIEVAL_NOT_INFERRED_TRAIT",{
            "content_files_retrieved":j["n_original_source_content_files_retrieved"],
            "source_statuses":{r["source_id"]:r["status"] for r in j["source_receipts"]},
            "data_effect_not_claimed":j["no_global_optical_effect_claimed"]})
          PY
      - name: Save only original-source access and original workbook schema receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage72-original-Kantsa-Xie-Albor-source-and-OA-XLSX-inventory
          path: stage72_original_author_primary_source_audit/
          retention-days: 90
          if-no-files-found: warn
