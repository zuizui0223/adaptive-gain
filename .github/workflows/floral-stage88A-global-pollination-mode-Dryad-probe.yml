name: Stage88A source-authenticated global 179263 plant pollination-mode original Dryad

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/floral_macro_stage88/probe_global_pollination_mode_source.py"
      - ".github/workflows/floral-stage88A-global-pollination-mode-Dryad-probe.yml"

permissions:
  contents: read

jobs:
  source-authenticated-original-wang-2025-dryad:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify original 2025 DOI/version and actual source file list
        run: |
          python research/floral_macro_stage88/probe_global_pollination_mode_source.py \
            --out stage88_source_original_Dryad_mode_receipt.json
      - name: Confirm no inferred species-level pollination-mode observations
        run: |
          python - <<'PY'
          import json
          d=json.load(open("stage88_source_original_Dryad_mode_receipt.json"))
          assert d["author_DOI"]=="10.5061/dryad.73n5tb35w"
          assert d["original_version_id"]>0
          assert any("Combine_data_uploaded_Final_20250411.Rdata" in str(f) for f in d["original_files"])
          assert d["we_will_not_classify_unknown_source_pollination_as_wind"]
          print("STAGE88A_TRUE_ORIGINAL_179263_DATABASE_SOURCE_IDENTIFIED")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage88A-Wang2025-Dryad-original-global-pollination-mode-metadata
          path: stage88_source_original_Dryad_mode_receipt.json
          if-no-files-found: error
