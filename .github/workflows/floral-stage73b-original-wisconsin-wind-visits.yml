name: floral-stage73b-original-Wisconsin-field-WIND-flowers-real-visits

on:
  push:
    branches: [analysis/floral-dryad-original-site-optical-stage73-20261117]
    paths:
      - "research/floral_original_field_stage73/audit_original_wisconsin_wind_visits.py"
      - "research/floral_original_field_stage73/test_audit_original_wisconsin_wind_visits.py"
      - "research/floral_original_field_stage73/validate_original_wisconsin_plot_date_wind_guilds.py"
      - "research/floral_original_field_stage73/test_validate_original_wisconsin_plot_date_wind_guilds.py"
      - ".github/workflows/floral-stage73b-original-wisconsin-wind-visits.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-wisconsin-field-2022:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Original source mock guards
        run: |
          python -m unittest discover \
            -s research/floral_original_field_stage73 \
            -p 'test_audit_original_wisconsin_wind_visits.py' -v
      - name: Download author original 2022 Wisconsin wind and field visitor workbook with immutable Git blob verification
        run: |
          python -u research/floral_original_field_stage73/audit_original_wisconsin_wind_visits.py \
            --outdir stage73b_verified_original_wisconsin
      - name: Verify genuine author source field wind vs ordinal flower colour separation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("stage73b_verified_original_wisconsin/original_wisconsin_2022_author_WIND_VISIT_FLORAL_WORKBOOK_coverage.json")
          d=json.loads(p.read_text())
          assert d["source_authentic_bytes"]==69522
          assert d["original_Git_blob_SHA1"]=="d456ddae4b5a737fc3351a5df612bd6a4b2c6244"
          assert d["source_sheet_count"]>=5
          assert d["wind_is_beaufort_ordinal_field_observation"]
          assert d["petal_wvl_is_ordinal_literature_color_NOT_spectrometric_nm"]
          assert d["visitor_zeros_are_not_inferred_from_absent_rows"]
          assert d["source_plot_date_site_keys_not_yet_validated"]
          assert d["original_source_wind_and_visits_association_fitted"] is False
          print("STAGE73B_REAL_AUTHOR_WISCONSIN_FIELD_SOURCE_REPLAY",{
             "source_original_sheets":[{
                "sheet":x["author_source_sheet"],
                "data_rows":x["source_data_rows_nonempty_after_header"],
                "headings":x["source_original_header_names_first50"][:18],
                "wind_sample":x.get("original_wind_distinct_value_sample",[]),
                "site_sample":x.get("original_site_distinct_value_sample",[])}
                for x in d["source_Excel_sheets"]]
          })
          PY
      - name: Test source three-key plot matching and author 2021/README 2022 date conflict
        run: |
          python -m unittest discover \
            -s research/floral_original_field_stage73 \
            -p 'test_validate_original_wisconsin_plot_date_wind_guilds.py' -v
      - name: Match original site-date-plot wind levels to real visitors and reference flower trait names
        run: |
          python -u research/floral_original_field_stage73/validate_original_wisconsin_plot_date_wind_guilds.py \
            --outdir stage73b_verified_original_wisconsin
      - name: Verify no false original year, non-recorded visitors or false UV reflectance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("stage73b_verified_original_wisconsin/source_wisconsin_original_plot_visitor_wind_and_date_semantics.json")
          j=json.loads(p.read_text())
          assert j["author_README_says_sampling_2022"]
          assert j["author_README_vs_original_Excel_date_conflict_UNRESOLVED"]
          assert j["original_interpreted_year_counts"]=={"2021":12}
          assert j["source_weather_year_alignment_allowed"] is False
          assert j["original_source_plots"]==143
          assert j["original_source_plant_rows"]==484
          assert j["original_source_visitor_rows"]==356
          assert j["original_duplicate_plot_keys"]>=0
          assert j["original_unique_complete_site_date_plot_keys"]>=1
          assert j["source_literature_categorical_flower_colour_is_UV_reflectance"] is False
          assert j["original_visits_are_pollen_effectiveness_or_fitness"] is False
          assert j["source_flower_wind_guild_model_fitted"] is False
          print("STAGE73C_WISCONSIN_ACTUAL_ORIGINAL_VISITOR_WIND_PLOT_KEYS_VALIDATED",{
            "unique_plots":j["original_unique_complete_site_date_plot_keys"],
            "duplicates":j["original_duplicate_plot_keys"],
            "within_site_date_varied_wind":j["source_site_date_groups_with_at_least_2_wind_categories"],
            "source_site_dates":j["source_unique_site_date_groups"],
            "plot_wind_counts":j["field_plots_by_original_Beaufort_category"],
            "source_visitor_count_by_wind":j["source_wind_class_recorded_visitation_counts"],
            "trait_name_match":j["visited_plant_name_matched_author_literature_trait_species"],
            "join_gaps":j["source_visitor_join_taxon_coverage_issues"]
          })
          PY
      - name: Upload authenticated original Wisconsin study design and field data coverage receipts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage73b-original-Wisconsin-2022-four-sites-wind-visitor-floral-source
          path: stage73b_verified_original_wisconsin/
          retention-days: 90
          if-no-files-found: warn
