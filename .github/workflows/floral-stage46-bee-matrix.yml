name: floral-stage46-original-compact-Bee-model-matrix-audit
# Legacy 126MB direct-GET path returns HTTP 406; superseded by source-verified
# HTTP 206 ZIP-member extraction (floral-stage46-source-PA-matrix.yml).
# Kept for provenance only, deliberately manual to avoid known failed runs.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authentic-global-bee-presence-matrix-and-UV-source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline original ZIP structure and no-Bombus prediction tests
        working-directory: research/floral_visual_macro_stage46
        run: python -m unittest -v test_inspect_bee_matrix_bundle
      - name: Download and checksum only 126MB compact bee model input bundle, not 21GB SDMs
        working-directory: research/floral_visual_macro_stage46
        run: python -u inspect_bee_matrix_bundle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage46-source-model-bee-grid-and-original-UV-workbook-schema
          path: research/floral_visual_macro_stage46/stage46_matrix_structure/*.json
          if-no-files-found: error
          retention-days: 90
