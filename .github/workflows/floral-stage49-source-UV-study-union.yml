name: floral-stage49-original-studies-GBIF-accepted-UV-taxon-union
on:
  push:
    branches: [analysis/floral-literature-uv-taxonomic-atlas-stage49-20261116]
    paths:
      - 'research/floral_visual_macro_stage49/join_source_authenticated_accepted_uv_studies.py'
      - 'research/floral_visual_macro_stage49/test_join_source_authenticated_accepted_uv_studies.py'
      - '.github/workflows/floral-stage49-source-UV-study-union.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  deduplicate-original-studies-by-Gbif-accepted-species:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline original-study distinct phenotype evidence tests
        working-directory: research/floral_visual_macro_stage49
        run: python -m unittest -v test_join_source_authenticated_accepted_uv_studies
      - name: Read source-verified 2016 177 UV taxonomy artifact
        uses: actions/download-artifact@v4
        with:
          repository: zuizui0223/adaptive-gain
          run-id: 43862161335
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: stage49-original-Koski-Ashman2016-177-UV-patterned-taxa-GBIF-keys
          path: research/floral_visual_macro_stage49/source_2016_input
      - name: Read source-verified 2020/21 121 UV taxonomy artifact
        uses: actions/download-artifact@v4
        with:
          repository: zuizui0223/adaptive-gain
          run-id: 43859048339
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: stage49-original-literature-121-source-taxa-GBIF-taxonomy
          path: research/floral_visual_macro_stage49/source_2020_2021_input
      - name: Deduplicate accepted species identities, keeping UV measurement kind
        working-directory: research/floral_visual_macro_stage49
        run: |
          python -u join_source_authenticated_accepted_uv_studies.py \
            --original-2016 source_2016_input/nph2016_original_177_UV_trait_GBIF_accepted_taxon_key.csv \
            --other-2020-2021 source_2020_2021_input/original_121_source_visual_taxa_GBIF_species_keys.csv
      - name: Validate genuine accepted species counts and no false UV pattern labels
        working-directory: research/floral_visual_macro_stage49
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('stage49_unified_published_visual_species')
          r=json.loads((p/'source_unique_accepted_species_overlap_receipt.json').read_text())
          assert r['status']=='AUTHENTIC_PUBLISHED_VISUAL_TAXONOMY_DEDUPLICATED_BY_ACCEPTED_GBIF_SPECIES'
          assert r['source_2016_UV_mapped_taxon_units']==164
          assert r['source_2021_UV_mapped_taxon_units']==71
          assert r['source_2020_historical_UVP_mapped_taxon_units']==40
          assert r['source_specific_mapped_taxon_units_total']==275
          assert 159<=r['n_unique_accepted_species_across_three_study_sources']<=275
          assert r['never_sum_overlapping_published_species_denominators']
          assert r['source_taxon_subspecies_are_not_independent_accepted_species']
          assert r['no_suitability_by_UV_pattern_spatial_coefficient_yet']
          with (p/'literature_directly_measured_UV_species_GBIF_unique_accepted_registry.csv').open() as h:
              rows=list(csv.DictReader(h))
          assert len(rows)==r['n_unique_accepted_species_across_three_study_sources']
          assert len({q['gbif_accepted_species_key'] for q in rows})==len(rows)
          assert all(q['Bee_suitability_at_source_species_range']=='NOT_MODELLED' for q in rows)
          print('STAGE49_REPRODUCED_ACCEPTED_SPECIES_COUNTS',json.dumps(r,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage49-source-authenticated-accepted-UV-literature-species-union
          path: research/floral_visual_macro_stage49/stage49_unified_published_visual_species/*
          if-no-files-found: error
          retention-days: 90
