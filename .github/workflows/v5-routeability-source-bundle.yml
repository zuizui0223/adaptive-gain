name: v5-routeability-source-bundle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v5-routeability-source-bundle.yml"
      - "manuscript/MANUSCRIPT_EVOLUTION_LETTERS_V5_ROUTEABILITY.md"
      - "manuscript/SUPPLEMENT_EVOLUTION_LETTERS_V5_ROUTEABILITY.md"
      - "manuscript/FIGURE_PLAN_EVOLUTION_LETTERS_V5_ROUTEABILITY.md"
      - "manuscript/FIGURE_LEGENDS_EVOLUTION_LETTERS_V5_ROUTEABILITY.md"
      - "manuscript/COVER_LETTER_EVOLUTION_LETTERS_V5_ROUTEABILITY.md"
      - "manuscript/figures/figure_el1_routeability_v5.svg"
      - "manuscript/figures/figure_el2_equivalence_niche_v5.svg"
      - "manuscript/figures/figure_el3_accessible_network_v5.svg"
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record source commit
        run: |
          mkdir -p submission_source_v5/manuscript/figures
          git rev-parse HEAD > submission_source_v5/SOURCE_COMMIT.txt
      - name: Copy V5 submission sources
        run: |
          cp manuscript/MANUSCRIPT_EVOLUTION_LETTERS_V5_ROUTEABILITY.md submission_source_v5/manuscript/
          cp manuscript/SUPPLEMENT_EVOLUTION_LETTERS_V5_ROUTEABILITY.md submission_source_v5/manuscript/
          cp manuscript/FIGURE_PLAN_EVOLUTION_LETTERS_V5_ROUTEABILITY.md submission_source_v5/manuscript/
          cp manuscript/FIGURE_LEGENDS_EVOLUTION_LETTERS_V5_ROUTEABILITY.md submission_source_v5/manuscript/
          cp manuscript/COVER_LETTER_EVOLUTION_LETTERS_V5_ROUTEABILITY.md submission_source_v5/manuscript/
          cp manuscript/figures/figure_el1_routeability_v5.svg submission_source_v5/manuscript/figures/
          cp manuscript/figures/figure_el2_equivalence_niche_v5.svg submission_source_v5/manuscript/figures/
          cp manuscript/figures/figure_el3_accessible_network_v5.svg submission_source_v5/manuscript/figures/
      - name: Record source checksums
        run: |
          cd submission_source_v5
          sha256sum manuscript/MANUSCRIPT_EVOLUTION_LETTERS_V5_ROUTEABILITY.md \
                    manuscript/SUPPLEMENT_EVOLUTION_LETTERS_V5_ROUTEABILITY.md \
                    manuscript/FIGURE_PLAN_EVOLUTION_LETTERS_V5_ROUTEABILITY.md \
                    manuscript/FIGURE_LEGENDS_EVOLUTION_LETTERS_V5_ROUTEABILITY.md \
                    manuscript/COVER_LETTER_EVOLUTION_LETTERS_V5_ROUTEABILITY.md \
                    manuscript/figures/figure_el1_routeability_v5.svg \
                    manuscript/figures/figure_el2_equivalence_niche_v5.svg \
                    manuscript/figures/figure_el3_accessible_network_v5.svg \
                    > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: evolution-letters-v5-routeability-source
          path: submission_source_v5
          if-no-files-found: error
          retention-days: 30
