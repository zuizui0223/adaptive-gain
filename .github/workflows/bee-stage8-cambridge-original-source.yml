name: bee-stage8-cambridge-original-kinematics-source
on:
  push:
    branches:
      - analysis/bee-cambridge-floral-biomechanics-20261028
    paths:
      - 'research/bee_biomechanics_stage8/**'
      - '.github/workflows/bee-stage8-cambridge-original-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cambridge-bee-bout-original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test source-level Cambridge DSpace discovery and unmodified byte checks
        working-directory: research/bee_biomechanics_stage8
        run: python -m unittest test_source_audit -v
      - name: Discover and verify original Cambridge 3-colony tagged-bee event data
        run: python -u research/bee_biomechanics_stage8/source_audit.py --out bee_stage8_source
      - name: Retain only checksum+schema receipts (not individual visit microdata)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bee-stage8-cambridge-original-data-receipt
          path: bee_stage8_source/original_cambridge_source_audit.json
          if-no-files-found: warn
          retention-days: 90
