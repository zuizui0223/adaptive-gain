name: bee-stage5-verified-flower-geometry
on:
  push:
    branches:
      - analysis/bee-spatial-geometric-baseline-20261028
    paths:
      - 'research/bee_behavior_stage5/**'
      - '.github/workflows/bee-stage5-verified-flower-geometry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-actual-figure2-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original PDF figure renderer (fallback)
        run: python -m pip install 'pymupdf==1.26.6'
      - name: Verify fixed physical coordinate graph and synthetic train/test leakage guards
        working-directory: research/bee_behavior_stage5
        run: python -m unittest test_geo_history_holdout -v
      - name: Retrieve original Fig 2 or article PDF page
        run: python -u research/bee_behavior_stage5/figure_source_audit.py --out bee_stage5_geo_source
      - name: Score real last-day bee routes against original publisher meter distances
        run: python -u research/bee_behavior_stage5/run_geo_history.py --out bee_stage5_geo_source
      - name: Retain original figure provenance and geometry-model receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bee-stage5-geometric-route-model-source-receipt
          path: |
            bee_stage5_geo_source/figure_source_receipt.json
            bee_stage5_geo_source/original_geometry_history_heldout.json
          if-no-files-found: warn
          retention-days: 90
