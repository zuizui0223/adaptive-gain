name: routing-figure-build-v2-once
on:
  push:
    branches: [figures/routing-paper-v2-self-contained]
permissions:
  contents: write
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[figure-build-v2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: figures/routing-paper-v2-self-contained
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python routing_paper/figures/generate_figures.py
      - name: Validate exact figure semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('routing_paper/figures')
          names=['figure1_routing_layers.svg','figure2_occupancy_thresholds.svg','figure3_scope_controls.svg']
          for n in names:
              p=root/n
              assert p.exists(), n
              s=p.read_text(encoding='utf-8')
              assert '<svg' in s[:500] and s.rstrip().endswith('</svg>') and len(s)>1000
          f1=(root/names[0]).read_text()
          f2=(root/names[1]).read_text()
          f3=(root/names[2]).read_text()
          for token in ['19','7','1','2^k - 1']:
              assert token in f1, token
          for token in ['mode','majority','49/117','9.09','q+2','q+3']:
              assert token.lower() in f2.lower(), token
          for token in ['4/7','4/37','representation','neutral mutation']:
              assert token.lower() in f3.lower(), token
          print('figure semantics validated')
          PY
      - name: Commit SVGs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add routing_paper/figures/*.svg
          git commit -m '[figure-build-v2] Generate routing paper figures'
          git push origin HEAD:figures/routing-paper-v2-self-contained
