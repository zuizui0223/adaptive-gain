name: poms-source-recovery-20261020
on:
  push:
    branches: ['analysis/poms-cross-design-transfer-20261020']
    paths: ['.github/workflows/poms-source-recovery-20261020.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover-verified-public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recover official source and verify both original CSVs
        run: |
          python - <<'PY'
          import hashlib, io, json, os, pathlib, shutil, urllib.request, zipfile
          out = pathlib.Path('poms_recovered_source')
          out.mkdir()
          url = 'https://data-package.ceh.ac.uk/data/d706088c-9d48-4be5-b156-6ed6ad5e0618.zip'
          request = urllib.request.Request(url, headers={'User-Agent': 'adaptive-gain-source-recovery/1.0'})
          with urllib.request.urlopen(request, timeout=90) as response:
              raw = response.read(30_000_001)
          if len(raw) > 30_000_000:
              raise ValueError('SOURCE_TOO_LARGE')
          expected = {
              'data/ukpoms_1kmfitcountdata_2017-2023.csv': '29d3deb757c053774c26ece0a7683081a4b4fe81d9497877fe1179f232182e52',
              'data/ukpoms_publicfitcountdata_2017-2023.csv': 'bcd2ef780d3208a5a4aba5c191178900ccef705e5b569dc0160b27d00652dc3c',
          }
          checked = {}
          with zipfile.ZipFile(io.BytesIO(raw)) as source:
              for name, digest in expected.items():
                  actual = hashlib.sha256(source.read(name)).hexdigest()
                  if actual != digest:
                      raise ValueError('SOURCE_CHANGED: ' + name)
                  checked[name] = actual
          (out / 'poms_original_2017_2023.zip').write_bytes(raw)
          for name in ('site_holdout_model.py', 'test_site_holdout_model.py', 'SITE_HOLDOUT_CONTRACT_2026_10_20.md'):
              shutil.copyfile(pathlib.Path('research/poms_external') / name, out / name)
          receipt = {'source_url': url, 'source_doi': '10.5285/d706088c-9d48-4be5-b156-6ed6ad5e0618', 'zip_sha256': hashlib.sha256(raw).hexdigest(), 'zip_bytes': len(raw), 'csv_sha256': checked, 'source_commit': os.environ['GITHUB_SHA'], 'purpose': 'Recover the unchanged public source for the user-authorized local cross-design analysis. No ecological result claimed.'}
          (out / 'source_receipt.json').write_text(json.dumps(receipt, indent=2))
          print('VERIFIED_SOURCE_RECOVERED', json.dumps(receipt), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: poms-recovered-public-source-and-model
          path: poms_recovered_source/
          retention-days: 14
          if-no-files-found: error
