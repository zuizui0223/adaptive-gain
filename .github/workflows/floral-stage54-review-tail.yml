name: floral-stage54-original-review-late-pages-151-denominator-debug
on:
  push:
    branches: [analysis/floral-multimodal-literature-atlas-stage54-20261116]
    paths:
      - research/floral_visual_macro_stage54/diagnose_151_tail_pages.py
      - .github/workflows/floral-stage54-review-tail.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-2025-151-review-tail-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.3'
      - name: Inspect remaining original Table S1 pages, taxon columns only
        working-directory: research/floral_visual_macro_stage54
        run: python -u diagnose_151_tail_pages.py
      - uses: actions/upload-artifact@v4
        with:
          name: stage54-2025-colour-change-151-original-tail-page-diagnostic
          path: research/floral_visual_macro_stage54/stage54_151_tail_diagnostic/*.json
          if-no-files-found: error
