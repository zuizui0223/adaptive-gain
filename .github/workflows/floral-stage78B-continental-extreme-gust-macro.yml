name: floral-stage78B-continental-strong-ERA5-gust-Bombus-visual-MACRO

on:
  push:
    branches: [analysis/floral-bombus-strong-gust-extremes-stage78-20261118]
    paths:
      - "research/floral_macro_stage78/source_era5_strong_gust_visual_Bombus_macro.py"
      - "research/floral_macro_stage78/test_source_era5_strong_gust_visual_Bombus_macro.py"
      - ".github/workflows/floral-stage78B-continental-extreme-gust-macro.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original-source-strong-gust-continental-macro:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install study-cluster statistical model software
        run: |
          python -m pip install "pandas>=2.1,<3" "statsmodels>=0.14,<1" "numpy>=1.26,<3"
      - name: Verify source-free original gust sample and extreme thresholds
        run: |
          python -m unittest discover \
            -s research/floral_macro_stage78 \
            -p "test_source_era5_strong_gust_visual_Bombus_macro.py" -v
      - name: Restore original verified 59k NHM botanical text
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44051561567 \
            --repo zuizui0223/adaptive-gain \
            --name stage68-NHM-original-botanical-TEXT-59k-traits-no-photo-no-UV \
            --dir stage78b_original_NHM
          test -s stage78b_original_NHM/combined/original_NHM_text_traits_compact.csv
          echo "b81ab96a2883e2b2e7f254a9e7ab62a34afaa0dfe62f0062d1677ba852dc686a  stage78b_original_NHM/combined/original_NHM_text_traits_compact.csv" | sha256sum -c
      - name: Restore source-authenticated real EuPPollNet corrected 18,798 plant-by-field records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44057077625 \
            --repo zuizui0223/adaptive-gain \
            --name stage69-v130-corrected-REAL-EuPPollNet-guild-network-NHM-text-spectra \
            --dir stage78b_original_plant_network
          test -s stage78b_original_plant_network/original_plant_network_year_observed_guilds_text_spectra.csv
          echo "475863c2b193dd9c1eaad848dae05a9f518b57446cad2661979ca582c7d88617  stage78b_original_plant_network/original_plant_network_year_observed_guilds_text_spectra.csv" | sha256sum -c
      - name: Restore exact original 1,864 real field networks with source year/month and coordinates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44205235512 \
            --repo zuizui0223/adaptive-gain \
            --name stage77-ORIGINAL-WORLDCLIM-WIND-54study-1864-field-sites-vs-Bombus \
            --dir stage78b_original_field_site
          test -s stage78b_original_field_site/original_1864_network_sites_worldclim_wind_climate_normals.csv
          echo "948ac0ecbcfc9b8a2e810753748a5436d998cd586574ea185c6da5db08cbce53  stage78b_original_field_site/original_1864_network_sites_worldclim_wind_climate_normals.csv" | sha256sum -c
      - name: Download historical ERA5 10m DAILY MAX GUST observed source survey months — study-balanced 43-study subcohort
        run: |
          python -u research/floral_macro_stage78/source_era5_strong_gust_visual_Bombus_macro.py \
            --source-NHM stage78b_original_NHM/combined/original_NHM_text_traits_compact.csv \
            --source-plant-network stage78b_original_plant_network/original_plant_network_year_observed_guilds_text_spectra.csv \
            --source-original-field-climate stage78b_original_field_site/original_1864_network_sites_worldclim_wind_climate_normals.csv \
            --outdir stage78b_actual_ERA5_extreme_macro
      - name: Verify true source extreme gusts, fixed thresholds, study-stratified 424 original colour networks
        run: |
          python - <<'PY'
          import json,csv
          from pathlib import Path
          p=Path("stage78b_actual_ERA5_extreme_macro")
          d=json.loads((p/"source_ERA5_actual_gust_bombus_visual_macro_and_audit.json").read_text())
          cohort=d["source_visual_network_frame_and_study_balance"]
          assert cohort["original_source_visual_networks"]==424
          assert cohort["source_unique_coordinate_visual_networks"]==422
          assert cohort["study_balanced_frozen_studies"]>=35
          assert cohort["study_balanced_frozen_networks"]>=95
          assert cohort["source_Bombus_visitation_ignored_during_selection"]
          assert d["source_actual_ERA5_requests_recorded"]>5
          assert d["source_actual_ERA5_requests_recorded"]<=280
          assert d["primary_gust_threshold_m_s"]==15
          assert d["sensitivity_gust_threshold_m_s"]==[10,20]
          assert d["source_ERA5_reanalysis_gust_not_original_anemometer"]
          assert d["no_new_global_phylogenetic_sem_or_scent_mediation"]
          assert d["user_request_extreme_wind_not_mean_wind_addressed"]
          with (p/"source_ERA5_true_strong_gust_study_balanced_424_frame.csv").open() as f:
              x=list(csv.DictReader(f))
          assert len(x)==cohort["study_balanced_frozen_networks"]
          for r in x:
              assert int(r["original_ERA5_exposure_days_source_observed_visit_months"])>=28
              a=float(r["original_ERA5_fraction_days_10m_gust_ge_10_ms"])
              b=float(r["original_ERA5_fraction_days_10m_gust_ge_15_ms"])
              c=float(r["original_ERA5_fraction_days_10m_gust_ge_20_ms"])
              assert 0<=c<=b<=a<=1
              assert r["reanalysis_gust_is_not_visited_hour_actual_wind"]=="True"
          print("STAGE78B_REAL_54_STUDY_ERA5_STRONG_GUST_MACRO_VALIDATED",{
             "source_before_guild":cohort,
             "ERA5_daily_request_count":d["source_actual_ERA5_requests_recorded"],
             "real_STRONG_GUST_15_source_days_exposure":d["source_study_original_ERA5_analysis_cohort"],
             "models":{k:{
                "status":v["status"],
                "terms":v.get("source_predictors",[]),
                "study_leaveout_sign_flips":v.get("interaction_leave_one_study_out_sign_flips")
             } for k,v in d["strong_gust_x_visual_x_realized_Bombus_exploratory_models"].items()},
          })
          PY
      - name: Upload original ERA5 strong gust model outputs and complete API source SHA audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage78b-real-European-ERA5-strong-GUST-15ms-x-visual-Bombus-macro
          path: stage78b_actual_ERA5_extreme_macro/
          retention-days: 90
          if-no-files-found: warn
