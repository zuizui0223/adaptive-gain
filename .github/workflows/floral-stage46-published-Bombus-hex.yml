name: floral-stage46-source-modelled-Bombus-hex-richness
on:
  push:
    branches: [analysis/floral-visual-bombus-sdm-source-stage46-20261116]
    paths:
      - 'research/floral_visual_macro_stage46/derive_bombus_hex_prediction.py'
      - 'research/floral_visual_macro_stage46/test_derive_bombus_hex_prediction.py'
      - '.github/workflows/floral-stage46-published-Bombus-hex.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-predicted-Bombus-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline source-derived Bombus HEX aggregation tests
        working-directory: research/floral_visual_macro_stage46
        run: python -m unittest -v test_derive_bombus_hex_prediction
      - name: Verify original Laborieux 2026 modeled bee matrix member and derive actual Bombus grid counts
        working-directory: research/floral_visual_macro_stage46
        run: python -u derive_bombus_hex_prediction.py
      - name: Fail closed on claims about raw record counts and plant correlations
        working-directory: research/floral_visual_macro_stage46
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          d=Path('stage46_Bombus_prediction')
          r=json.loads((d/'source_Bombus_predicted_hex_coverage.json').read_text())
          assert r['status']=='SOURCE_VERIFIED_ORIGINAL_PREDICTED_BOMBUS_HEX_RICHNESS'
          assert r['original_input_rows']==396703
          assert r['source_member_SHA256']=='641c0bb832781d3c41402a6e8158d971d0d0f663557c3f53a3b81a69dbbacd15'
          assert r['n_distinct_modelled_Bombus_taxon_strings']>0
          assert r['n_grid_cells_with_any_modeled_bee_taxon']>0
          assert r['zero_is_no_modelled_genus_in_supplied_grid_not_true_biological_absence']
          assert r['not_raw_GBIF_occurrence_counts_or_relative_abundance']
          assert r['not_plant_X_Bombus_joint_model_or_realized_visitation']
          with (d/'source_Bombus_predicted_hex_richness.csv').open() as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==r['n_grid_cells_with_any_modeled_bee_taxon']
          assert sum(int(z['n_modelled_Bombus_taxa'])>0 for z in rows)==r['n_grid_cells_with_Bombus_modelled_presence']
          print('STAGE46_REAL_BOMBUS_HEX_PREDICTIONS_SOURCE_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage46-original-published-global-Bombus-predicted-HEX-richness
          path: |
            research/floral_visual_macro_stage46/stage46_Bombus_prediction/*.csv
            research/floral_visual_macro_stage46/stage46_Bombus_prediction/*.json
          if-no-files-found: error
          retention-days: 90
