name: Floral Stage81A real 219 author spectra and 28 EuPP original matches

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/floral_macro_stage81/probe_original_ohashi_28_stage_spectra.py"
      - "research/floral_macro_stage81/test_probe_original_ohashi_28_stage_spectra.py"
      - ".github/workflows/floral-stage81A-ohashi-spectrum-structure.yml"

permissions:
  contents: read
  actions: read

jobs:
  inspect-authentic-author-spectrum-stage-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install safe isolated XLS schema readers
        run: python -m pip install "xlrd==2.0.2" "openpyxl==3.1.5"
      - name: Verify tests without downloading source
        run: python -m unittest discover -s research/floral_macro_stage81 -p "test_probe_original_ohashi_28_stage_spectra.py" -v
      - name: Restore SHA-verified original Stage79D EuPP exact 28-species crosswalk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44241602748 \
            --repo zuizui0223/adaptive-gain \
            --name stage79d-2015-Ohashi219-spectrometer-original-ZIP-directory-coverage \
            --dir stage81_source_stage79d
          test -s stage81_source_stage79d/original_ohashi_2015_zipped_219_spectrum_folder_species_EuPP_overlap.json
      - name: Stream and MD5/SHA verify original 286MB author ZIP; inspect genuine workbook schema
        run: |
          python -u research/floral_macro_stage81/probe_original_ohashi_28_stage_spectra.py \
            --stage79d-overlap stage81_source_stage79d/original_ohashi_2015_zipped_219_spectrum_folder_species_EuPP_overlap.json \
            --outdir stage81_original_source_schema
      - name: Publish only original source metadata and minimal workbook schema previews
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage81a-ohashi-original-28-spectrometer-stage-layout
          path: stage81_original_source_schema/
          retention-days: 90
          if-no-files-found: warn
