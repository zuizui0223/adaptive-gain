name: floral-stage58-authentic-VOC305-plant-source-grain-wind-pollination
on:
  push:
    branches: [analysis/floral-wind-scent-routeability-stage58-20261117]
    paths:
      - research/floral_routeability_stage58/audit_VOC305_species_source_grain.py
      - .github/workflows/floral-stage58-VOC305-species-grain.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-2020-VOC-source-species-vs-airflow:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact OOXML original workbook reader
        run: python -m pip install --disable-pip-version-check 'openpyxl==3.1.5'
      - name: Original authenticated presence sheet specimen and pollination mode grain
        run: |
          PYTHONPATH=research/floral_routeability_stage58:. \
            python -u research/floral_routeability_stage58/audit_VOC305_species_source_grain.py
      - name: Enforce observed source rows vs published 305 species no meteorological wind mistake
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('stage58_original_VOC_305_source_grain/original_VOC_wind_pollination_vs_airflow_species_grain_receipt.json').read_text())
          assert d['status'] in (
             'ORIGINAL_FARRE_2020_PRESENCE_SOURCE_SPECIES_STUDY_GRAIN_AUDIT',
             'VOC305_ORIGINAL_DATA_GRAIN_NOT_VERIFIED_NO_FALSE_SPECIES_COUNTS')
          if d['status']=='ORIGINAL_FARRE_2020_PRESENCE_SOURCE_SPECIES_STUDY_GRAIN_AUDIT':
            assert d['n_source_excel_rows_including_header']==4461
            assert d['n_original_source_data_rows']==4460
            assert d['source_wind_column_is_pollination_mode_NOT_atmospheric_wind_speed']
            assert d['source_305_published_analysis_species_count_not_assumed_equal_to_XLSX_rows']
            assert d['source_VOC_missing_not_odor_absence']
            print('STAGE58_ORIGINAL_VOC_STUDY_RECORD_GRAIN',
                  {'original_data_rows':d['n_original_source_data_rows'],
                   'distinct_source_species_labels':d['n_distinct_verbatim_species_labels'],
                   'source_article_strings':d['n_distinct_source_article_strings'],
                   'wind_pollination_source_rows':d['source_receptor_pollination_mode_nonempty_row_counts'].get('wind_pollination_flag',0)})
          else:
            print('STAGE58_ORIGINAL_VOC_SOURCE_GRAIN_NO_GO',d)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage58-original-floral-VOC-305-4460-row-species-and-wind-pollination-grain
          path: stage58_original_VOC_305_source_grain/*
          if-no-files-found: error
          retention-days: 90
