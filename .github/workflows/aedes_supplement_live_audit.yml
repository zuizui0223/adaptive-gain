name: aedes-supplement-live-audit

on:
  push:
    branches:
      - planning/aedes-compound-resynthesis-v1

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Audit official Zeledon supplementary chemistry methods
        run: |
          python examples/audit_zeledon_supplement.py --timeout 45 | tee /tmp/zeledon_supplement_receipt.json
      - name: Preserve audit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeledon-supplement-audit-receipt
          path: /tmp/zeledon_supplement_receipt.json
          if-no-files-found: ignore
