name: bee-stage17-optional-first-request-design-only
on:
  push:
    branches: [design/bee-optional-first-query-stage17-20261111]
    paths:
      - 'research/bee_optional_stage17/**'
      - '.github/workflows/bee-stage17-optional-query.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-optional-query-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analytic Student-t only for fake colony-QA
        run: python -m pip install 'scipy==1.15.3'
      - name: Verify source-simulated SKIP, independent worlds, original request chronology and colony-balanced estimator
        working-directory: research/bee_optional_stage17
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Run physical source-free Stage17 synthetic gate and fixed shape contrast
        working-directory: research/bee_optional_stage17
        run: python -u run_all.py --out stage17_outputs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage17-no-real-bee-optional-query-design-receipts
          path: research/bee_optional_stage17/stage17_outputs/stage17_synthetic_design_receipt.json
          if-no-files-found: warn
          retention-days: 90
