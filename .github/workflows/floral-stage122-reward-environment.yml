name: Stage122 regional reward environment species-preserving null and source extension
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/floral_macro_stage122/**"
      - ".github/workflows/floral-stage122-reward-environment.yml"
permissions:
  contents: read
  actions: read
jobs:
  regional-source-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy==2.3.5" "pandas==2.2.3" "scipy==1.16.3"
      - name: Restore immutable Stage121 regional scores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error --retry 2 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/zuizui0223/adaptive-gain/actions/artifacts/15172455309/zip" -o stage121.zip
      - run: python -u research/floral_macro_stage122/regional_reward_environment.py --source stage121.zip --out derived/stage122_regional_environment.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage122-regional-environment
          path: derived/
          if-no-files-found: error
          retention-days: 90
  source-species-null:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy==2.3.5" "pandas==2.2.3" "scipy==1.16.3" "scikit-learn==1.7.2" "openpyxl==3.1.5"
      - run: python -m unittest discover -s research/floral_macro_stage122 -p "test_*.py" -v
      - name: Recover original immutable archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p archives
          for id in 14313209081 14316616619 14296278415 15172455309; do
            curl --fail --location --silent --show-error --retry 2 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/zuizui0223/adaptive-gain/actions/artifacts/$id/zip" -o "archives/github-actions-artifact-$id.zip"
          done
      - name: Original reward and geography source bytes
        run: |
          curl --fail --location --silent --show-error --retry 2 --retry-all-errors --connect-timeout 25 --max-time 180 "https://www.ebi.ac.uk/europepmc/webservices/rest/PMC12640470/supplementaryFiles" -o reward-original.zip
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 30 --max-time 1200 https://sftp.kew.org/pub/data-repositories/WCVP/wcvp.zip -o wcvp.zip
          echo "d32ea2b3a85e489b14e83bcc9eae7274532e1d113753f7be290d4b2dfde573fa  wcvp.zip" | sha256sum -c
      - name: Refit original regional predictor under species-preserving conditional null
        run: python -u research/floral_macro_stage122/reward_species_null.py --archive archives/github-actions-artifact-15172455309.zip --source reward-original.zip --archives archives --wcvp wcvp.zip --out derived/stage122_species_null.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage122-species-preserving-null
          path: derived/
          if-no-files-found: error
          retention-days: 90
  expanded-reward-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy==2.3.5" "pandas==2.2.3" "scipy==1.16.3" "scikit-learn==1.7.2" "openpyxl==3.1.5"
      - name: Obtain published original Filipiak file and author morphology
        run: |
          curl --fail --location --silent --show-error --retry 2 --retry-all-errors --connect-timeout 25 --max-time 180 "https://zenodo.org/records/5862277/files/phenology_pollen_nectar_sugar_database.csv?download=1" -o filipiak.csv
          echo "22c3c9ed5da88307a34fb7c213ae4fe9  filipiak.csv" | md5sum -c
          curl --fail --location --silent --show-error --retry 2 --retry-all-errors --connect-timeout 25 --max-time 180 "https://www.ebi.ac.uk/europepmc/webservices/rest/PMC12640470/supplementaryFiles" -o reward-original.zip
      - run: python -u research/floral_macro_stage122/expanded_reward_source.py --source filipiak.csv --author reward-original.zip --out derived/stage122_expanded_source.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage122-expanded-reward-source-audit
          path: derived/
          if-no-files-found: error
          retention-days: 90
