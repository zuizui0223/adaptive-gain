name: routing-figure-patch-once
on:
  push:
    branches: [figures/routing-paper-v2-self-contained]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[figure-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: figures/routing-paper-v2-self-contained
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove hand-coded q=2 constants from generator
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('routing_paper/figures/generate_figures.py')
          s=p.read_text()
          old='''def _majority_root_q2_k3():\n    return (7.0 + 5.0 * math.sqrt(5.0)) / 2.0\n'''
          new='''def _majority_root_q2(branch_count: int):\n    a1 = distance_layer_degeneracy(branch_count, 1)\n    a2 = distance_layer_degeneracy(branch_count, 2)\n    return (float(a1) + math.sqrt(float(a1 * a1 + 4 * a2))) / 2.0\n'''
          assert s.count(old)==1
          s=s.replace(old,new)
          assert s.count('root = _majority_root_q2_k3()')==1
          s=s.replace('root = _majority_root_q2_k3()','root = _majority_root_q2(k)')
          old2='''        d0, d1, d2 = counts = (19.0, 7.0, 1.0)\n        mass = d2 * th * th / (d0 + d1 * th + d2 * th * th)\n'''
          new2='''        d0, d1, d2 = (\n            float(weakest_branch_layer_degeneracy(q, k, r)) for r in range(3)\n        )\n        mass = d2 * th * th / (d0 + d1 * th + d2 * th * th)\n'''
          assert s.count(old2)==1
          s=s.replace(old2,new2)
          p.write_text(s)
          PY
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_routing_paper_figures.py
      - run: python routing_paper/figures/generate_figures.py
      - name: Commit patch and regenerated figures
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add routing_paper/figures/generate_figures.py routing_paper/figures/*.svg
          git commit -m '[figure-patch] Derive q=2 figure values from theorem API'
          git push origin HEAD:figures/routing-paper-v2-self-contained
