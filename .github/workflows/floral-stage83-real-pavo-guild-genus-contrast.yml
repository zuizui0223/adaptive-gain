name: Stage83 authentic Apis receptor far/near x EuPP bee source taxon falsification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/floral_macro_stage83/**"
      - "docs/FLORAL_STAGE83_RECEPTOR_NETWORK_TAXON_GENERALIZATION_20261118.md"
      - ".github/workflows/floral-stage83-real-pavo-guild-genus-contrast.yml"

permissions:
  contents: read
  actions: read

jobs:
  independently-recompute-original-far-near-visual-bee-associations:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical source readers
        run: python -m pip install "numpy==2.3.5" "pandas==2.2.3"
      - name: Verify source-free score and research independence semantics
        run: python -m unittest discover -s research/floral_macro_stage83 -p "test_*.py" -v
      - name: Restore original corrected real 18,798 EuPP plant visit source units
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44057077625 \
            --repo zuizui0223/adaptive-gain \
            --name stage69-v130-corrected-REAL-EuPPollNet-guild-network-NHM-text-spectra \
            --dir stage83_source_guild
      - name: Download authenticated Stage81D Apis receptor 28 taxa source artifact in ZIP bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14409142056/zip" \
            --output stage83_stage81d_authentic_original_pavo_apis_receptors.zip
          echo "9139935f10fbd94a8fb888d807af872c9e5289422249d138fb8a61ac799a0b2a  stage83_stage81d_authentic_original_pavo_apis_receptors.zip" | sha256sum -c
      - name: Independently recompute 4 Apis visual trait network scores, 9,999 species vector permutations, publication and genus holdouts
        run: |
          python -u research/floral_macro_stage83/original_receptor_vs_bee_taxon_audit.py \
            --original-eupp stage83_source_guild/original_plant_network_year_observed_guilds_text_spectra.csv \
            --stage81d-receptor-zip stage83_stage81d_authentic_original_pavo_apis_receptors.zip \
            --outdir stage83_original_receptor_results \
            --permutations 9999
      - name: Validate predeclared source denominators and absence of generalized signal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("stage83_original_receptor_results/stage83_original_true_apis_receptor_source_4signal_28taxon_194network.json").read_text())
          s=x["original_source_support"]
          assert (s["bee_informative_network_years"],s["outcome_blind_two_species_networks"],
                  s["independent_original_publications"],s["species_with_some_bee_information"]) == (194,537,30,23)
          assert x["model_detected_age_chromatic_shift_species_of_28"]==5
          assert x["model_far_maintained_near_reduced_species_of_28"]==12
          channels=x["channels"]
          assert len(channels)==4
          assert [d["source_bee_informative_networks"] for d in channels]==[194,194,194,83]
          expected=[-0.17743488615,0.46511536861,-0.87095027990,-1.06713418714]
          assert all(abs(d["local_null_score_U_over_I_NOT_a_fitted_bee_response_beta"]-v)<1e-7 for d,v in zip(channels,expected))
          assert all(d["species_vector_permutation_two_sided_tail_fraction"]>.05 for d in channels)
          assert all(d["four_signal_maxT_familywise_diagnostic_tail_fraction"]>.05 for d in channels)
          assert x["scientific_stop_gates"]["taxon_exchangeability_ignores_phylogenetic_nonindependence"]
          tar=[g for g in x["source_plant_genus_leave_out_recalculating_entire_network"] if g["excluded_genus"]=="taraxacum"]
          assert len(tar)==1 and tar[0]["scores_after_exclusion"][1]<0
          print("STAGE83_SOURCE_RECEPTOR_SIGNAL_GENERALIZATION_NOT_IDENTIFIED")
          PY
      - name: Archive only derived original-data numerical receipts, never spectra or visitor source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage83-original-28-apis-far-near-bee-taxonomic-independence
          path: stage83_original_receptor_results/
          retention-days: 90
          if-no-files-found: warn
