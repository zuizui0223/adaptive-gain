          import json
          from pathlib import Path

          result = json.loads(
              Path("artifact/annual_gain_loss_asymmetry_audit.json").read_text(
                  encoding="utf-8"
              )
          )
          if "posthoc_direction_seen_before_matched_audit" not in result["analysis_status"]:
              raise SystemExit("asymmetry audit lost its retrospective-status firewall")
          expected_result = json.loads(
              Path("validation/villavicencio_gain_loss_asymmetry_result_v1.json").read_text(
                  encoding="utf-8"
              )
          )
          if result["status"] != expected_result["status"]:
              raise SystemExit("asymmetry audit status disagrees with frozen result ledger")
          time_audit = json.loads(
              Path("validation/villavicencio_covariate_time_support_audit_v1.json").read_text(
                  encoding="utf-8"
              )
          )
          baseline_ledger = json.loads(
              Path("validation/villavicencio_conventional_filter_cv_result_v1.json").read_text(
                  encoding="utf-8"
              )
          )
          ablation_ledger = json.loads(
              Path("validation/villavicencio_filter_block_ablation_result_v1.json").read_text(
                  encoding="utf-8"
              )
          )
          if time_audit["status"] != "aggregate_time_support_confirmed":
              raise SystemExit("covariate time-support audit is not frozen green")
          if "not strict prospective forecasting" not in baseline_ledger["time_support"]["interpretation"]:
              raise SystemExit("baseline ledger lost the prospective-forecasting firewall")
          if "not past-only forecasting" not in ablation_ledger["time_support"]["consequence"]:
              raise SystemExit("ablation ledger lost the time-support firewall")
          time_support = result["matched_training_design"].get("time_support", "")
          if "six-year aggregates" not in time_support:
              raise SystemExit("asymmetry audit lost the aggregate-covariate time-support warning")
          wording_surface = " ".join(
              [
                  result.get("ecological_read", ""),
                  result.get("claim_ceiling", ""),
              ]
          ).lower()
          for forbidden in ("future link gains", "out-of-time predictability"):
              if forbidden in wording_surface:
                  raise SystemExit(
                      f"asymmetry audit reintroduced forbidden prospective wording: {forbidden}"
                  )
          for scope, expected in (
              ("strict_core_2008_2011", 3),
              ("near_core_2007_2011", 4),
              ("all_annual_2006_2011", 5),
          ):
              observed = result["scopes"][scope]
              if observed["transition_count"] != expected:
                  raise SystemExit(f"{scope}: transition count changed")
              for transition in observed["transitions"].values():
                  matched = transition["matched_information_training"]
                  if matched["replicates"] != 100:
                      raise SystemExit("matched audit replicate count changed")
          print(
              json.dumps(
                  {
                      "status": result["status"],
                      "strict_core_consistent": result["scopes"][
                          "strict_core_2008_2011"
                      ]["all_transitions_directionally_consistent"],
