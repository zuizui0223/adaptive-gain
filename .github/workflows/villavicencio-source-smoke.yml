name: Villavicencio source smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/villavicencio-source-smoke.yml"
      - "examples/fetch_dryad_source_manifest.py"
      - "examples/fetch_figshare_article_files.py"
      - "examples/export_villavicencio_subseasons.R"
      - "examples/reconstruct_villavicencio_subseasons_from_raw.py"
      - "validation/villavicencio_raw_subseason_reconstruction_gate_v1.json"
      - "examples/audit_villavicencio_subseason_sampling_effort.py"
      - "examples/villavicencio_subseason_effort_only_cv.R"
      - "examples/summarize_villavicencio_subseason_effort_only.py"
      - "examples/audit_villavicencio_effort_balanced_rarefaction.py"
      - "examples/build_villavicencio_census_rate_table.py"
      - "examples/villavicencio_census_rate_cv.R"
      - "examples/summarize_villavicencio_census_rate_cv.py"
      - "validation/villavicencio_census_rate_gate_v1.json"
      - "examples/villavicencio_two_season_detection_fit.R"
      - "examples/summarize_villavicencio_two_season_detection.py"
      - "validation/villavicencio_two_season_detection_gate_v1.json"
      - "examples/villavicencio_latent_opportunity_decomposition.R"
      - "examples/summarize_villavicencio_latent_opportunity_decomposition.py"
      - "validation/villavicencio_latent_opportunity_decomposition_gate_v1.json"
      - "validation/villavicencio_subseason_effort_audit_gate_v1.json"
      - "validation/villavicencio_subseason_effort_audit_result_v1.json"
      - "examples/build_villavicencio_annual_opportunity_effort_table.py"
      - "examples/villavicencio_opportunity_effort_control_cv.R"
      - "examples/summarize_villavicencio_opportunity_effort_control.py"
      - "validation/villavicencio_opportunity_effort_control_gate_v1.json"
      - "examples/villavicencio_stage1_from_csv.py"
      - "examples/villavicencio_conventional_filter_block_ablation.R"
      - "examples/summarize_villavicencio_filter_block_ablation.py"
      - "examples/villavicencio_gain_loss_matched_audit.R"
      - "examples/summarize_villavicencio_gain_loss_asymmetry.py"
      - "examples/diagnose_villavicencio_phenology_states.py"
      - "examples/audit_villavicencio_species_leverage.py"
      - "examples/audit_villavicencio_phenology_support_leakage.py"
      - "examples/build_villavicencio_focal_excluded_opportunity.py"
      - "examples/villavicencio_focal_excluded_opportunity_cv.R"
      - "examples/summarize_villavicencio_focal_excluded_opportunity.py"
      - "examples/villavicencio_link_frequency_threshold_audit.R"
      - "examples/summarize_villavicencio_link_frequency_threshold_audit.py"
      - "validation/villavicencio_link_frequency_threshold_audit_gate_v1.json"
      - "examples/build_villavicencio_siteweek_opportunity.py"
      - "examples/villavicencio_siteweek_opportunity_audit.R"
      - "examples/summarize_villavicencio_siteweek_opportunity_audit.py"
      - "validation/villavicencio_siteweek_opportunity_audit_gate_v1.json"
      - "examples/villavicencio_current_opportunity_axis_audit.R"
      - "examples/summarize_villavicencio_current_opportunity_axis_audit.py"
      - "examples/villavicencio_axis_robustness_audit.R"
      - "examples/summarize_villavicencio_axis_robustness_audit.py"
      - "validation/villavicencio_axis_robustness_audit_gate_v1.json"
      - "validation/villavicencio_current_opportunity_axis_audit_gate_v1.json"
      - "validation/villavicencio_focal_excluded_opportunity_gate_v1.json"
      - "validation/villavicencio_phenology_state_stratification_v1.json"
      - "validation/villavicencio_species_leverage_audit_v1.json"
      - "validation/villavicencio_phenology_support_leakage_v1.json"
      - "examples/build_villavicencio_transition_pairs.py"
      - "adaptive_gain/empirical_rewiring.py"
      - "validation/villavicencio_source_manifest_v1.json"
      - "validation/villavicencio_stage1_predata_gate_v1.json"
      - "validation/villavicencio_conventional_filter_gate_v1.json"
      - "validation/villavicencio_conventional_filter_cv_result_v1.json"
      - "validation/villavicencio_filter_block_ablation_gate_v1.json"
      - "validation/villavicencio_filter_block_ablation_result_v1.json"
      - "validation/villavicencio_covariate_time_support_audit_v1.json"
      - "validation/villavicencio_gain_loss_asymmetry_result_v1.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-smoke:
    runs-on: ubuntu-latest
    env:
      DRYAD_TOKEN: ${{ secrets.DRYAD_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Resolve anonymous Dryad source manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/response source/traits artifact/raw artifact/export artifact/manifests

          python examples/fetch_dryad_source_manifest.py             "doi:10.5061/dryad.j6q573n9j"             artifact/manifests/response_dryad_manifest.json             --target-name "miele-JAE.RData"             --target-id-output artifact/response_file_id.txt

          python examples/fetch_dryad_source_manifest.py             "doi:10.5061/dryad.8cz8w9gm1"             artifact/manifests/traits_dryad_manifest.json             --target-name "plant_pollinator_data.xlsx"             --target-id-output artifact/traits_file_id.txt

      - name: Recover public raw visitor records from Figshare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/figshare_visitors artifact/figshare
          python examples/fetch_figshare_article_files.py \
            11794503 \
            source/figshare_visitors \
            artifact/figshare/visitor_records_manifest.json

          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("artifact/figshare/visitor_records_manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          if manifest["downloaded_count"] < 1:
              raise SystemExit("no public Figshare visitor-record files materialized")
          for item in manifest["files"]:
              if item.get("downloaded"):
                  if not item.get("size_matches", False):
                      raise SystemExit(f"Figshare size mismatch: {item['name']}")
                  if not item.get("md5_matches", False):
                      raise SystemExit(f"Figshare checksum mismatch: {item['name']}")

          import csv
          import shutil

          inventory = []
          raw_copy = Path("artifact/figshare/raw")
          raw_copy.mkdir(parents=True, exist_ok=True)
          for path in sorted(Path("source/figshare_visitors").iterdir()):
              if not path.is_file():
                  continue
              entry = {
                  "name": path.name,
                  "size": path.stat().st_size,
                  "suffix": path.suffix.lower(),
              }
              if path.suffix.lower() == ".csv":
                  with path.open(newline="", encoding="utf-8-sig") as handle:
                      reader = csv.reader(handle)
                      header = next(reader, [])
                      first_rows = []
                      row_count = 0
                      for row in reader:
                          row_count += 1
                          if len(first_rows) < 5:
                              first_rows.append(row)
                  entry["header"] = header
                  entry["data_row_count"] = row_count
                  entry["first_rows"] = first_rows
              shutil.copy2(path, raw_copy / path.name)
              inventory.append(entry)
          Path("artifact/figshare/visitor_records_inventory.json").write_text(
              json.dumps(
                  {
                      "schema": "adaptive-gain-villavicencio-figshare-visitor-inventory-v1",
                      "article_id": 11794503,
                      "files": inventory,
                      "ecological_role": "independent public raw-record fallback for reconstructing the 18-subseason response surface",
                      "response_analysis_run": False,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          print(json.dumps(inventory, indent=2))
          PY

      - name: Download published source bytes when authorized or mirrored
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE_ID="$(cat artifact/response_file_id.txt)"
          TRAITS_ID="$(cat artifact/traits_file_id.txt)"

          if test -n "${DRYAD_TOKEN:-}"; then
            if curl -fL --retry 2 --retry-delay 2               -H "Authorization: Bearer $DRYAD_TOKEN"               "https://datadryad.org/api/v2/files/$RESPONSE_ID/download"               -o source/response/miele-JAE.RData
            then
              echo "dryad_response_bytes=available_via_bearer_token"                 > artifact/response_download_status.txt
            else
              rm -f source/response/miele-JAE.RData
              echo "dryad_response_bytes=token_download_failed"                 > artifact/response_download_status.txt
            fi
          else
            echo "dryad_response_bytes=metadata_only_no_bearer_token"               > artifact/response_download_status.txt
          fi

          CONICET_PAGE="https://datosdeinvestigacion.conicet.gov.ar/handle/11336/249358?show=full"
          curl -fL --retry 2 --retry-delay 2 -A "Mozilla/5.0"             "$CONICET_PAGE" -o artifact/conicet_item.html || true
          curl -fL --retry 2 --retry-delay 2 -A "Mozilla/5.0"             "https://datosdeinvestigacion.conicet.gov.ar/rest/dataset/11336/249358"             -o artifact/conicet_dataset.json || true

          CONICET_HREF="$(
            python - <<'PY'
          import html
          import json
          import re
          from pathlib import Path

          candidates = []

          page = Path("artifact/conicet_item.html")
          if page.exists():
              text = page.read_text(encoding="utf-8", errors="ignore")
              candidates.extend(
                  html.unescape(value)
                  for value in re.findall(
                      r'href=["\x27]([^"\x27]*plant_pollinator_data\.xlsx[^"\x27]*)["\x27]',
                      text,
                  )
              )

          def walk(value):
              if isinstance(value, dict):
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
              elif isinstance(value, str):
                  if "plant_pollinator_data.xlsx" in value or "/bitstream/" in value:
                      candidates.append(value)

          metadata = Path("artifact/conicet_dataset.json")
          if metadata.exists():
              try:
                  walk(json.loads(metadata.read_text(encoding="utf-8")))
              except Exception:
                  pass

          cleaned = []
          for value in candidates:
              value = html.unescape(value)
              if value not in cleaned:
                  cleaned.append(value)

          Path("artifact/conicet_candidate_urls.txt").write_text(
              "\n".join(cleaned) + ("\n" if cleaned else ""),
              encoding="utf-8",
          )
          print(cleaned[0] if cleaned else "")
          PY
          )"

          if test -n "$CONICET_HREF"; then
            case "$CONICET_HREF" in
              http*) CONICET_FILE="$CONICET_HREF" ;;
              /*) CONICET_FILE="https://datosdeinvestigacion.conicet.gov.ar$CONICET_HREF" ;;
              *) CONICET_FILE="https://datosdeinvestigacion.conicet.gov.ar/$CONICET_HREF" ;;
            esac
          else
            CONICET_FILE=""
          fi
          printf '%s\n' "$CONICET_FILE" > artifact/conicet_resolved_file_url.txt

          TRAIT_DONE=0
          if test -n "$CONICET_FILE" && curl -fL --retry 2 --retry-delay 2             -A "Mozilla/5.0"             -e "$CONICET_PAGE"             "$CONICET_FILE"             -o source/traits/plant_pollinator_data.xlsx
          then
            echo "trait_source=conicet_mirror_resolved_from_metadata"               > artifact/trait_download_status.txt
            TRAIT_DONE=1
          else
            rm -f source/traits/plant_pollinator_data.xlsx
          fi

          if test "$TRAIT_DONE" -eq 0; then
            EMLN_COMMIT="07797e23510cec0a68257ba405d763b60b8e6968"
            EMLN_PATH="data/emln_db_datasets/65_Temporal_Chacoff_2020/plant_pollinator_data.xlsx"
            EMLN_URL="https://raw.githubusercontent.com/Ecological-Complexity-Lab/emln_package/$EMLN_COMMIT/$EMLN_PATH"
            if curl -fL --retry 2 --retry-delay 2 \
              -A "Mozilla/5.0" \
              "$EMLN_URL" \
              -o source/traits/plant_pollinator_data.xlsx
            then
              echo "trait_source=github_emln_pinned_mirror_pending_digest_verification" \
                > artifact/trait_download_status.txt
              {
                echo "repository=Ecological-Complexity-Lab/emln_package"
                echo "commit=$EMLN_COMMIT"
                echo "path=$EMLN_PATH"
                echo "github_blob_sha=99eef735b001751b4407f8fae67d271c2c63a1f3"
                echo "declared_size_bytes=230652"
              } > artifact/trait_mirror_provenance.txt
              TRAIT_DONE=1
            else
              rm -f source/traits/plant_pollinator_data.xlsx
            fi
          fi

          if test "$TRAIT_DONE" -eq 0 && test -n "${DRYAD_TOKEN:-}"; then
            if curl -fL --retry 2 --retry-delay 2               -H "Authorization: Bearer $DRYAD_TOKEN"               "https://datadryad.org/api/v2/files/$TRAITS_ID/download"               -o source/traits/plant_pollinator_data.xlsx
            then
              echo "trait_source=dryad_bearer_token"                 > artifact/trait_download_status.txt
              TRAIT_DONE=1
            else
              rm -f source/traits/plant_pollinator_data.xlsx
            fi
          fi

          if test "$TRAIT_DONE" -eq 0; then
            echo "trait_source=metadata_only_bytes_unavailable"               > artifact/trait_download_status.txt
          fi

          if test -s source/traits/plant_pollinator_data.xlsx; then
            file source/traits/plant_pollinator_data.xlsx
          fi
          if test -s source/response/miele-JAE.RData; then
            file source/response/miele-JAE.RData
          fi

      - name: Verify materialized bytes against published Dryad digests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          checks = [
              (
                  "response",
                  Path("artifact/manifests/response_dryad_manifest.json"),
                  "miele-JAE.RData",
                  Path("source/response/miele-JAE.RData"),
              ),
              (
                  "traits",
                  Path("artifact/manifests/traits_dryad_manifest.json"),
                  "plant_pollinator_data.xlsx",
                  Path("source/traits/plant_pollinator_data.xlsx"),
              ),
          ]

          rows = []
          mismatch = False
          for role, manifest_path, source_name, source_path in checks:
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              matches = [
                  row for row in manifest["files"]
                  if row["path"] == source_name
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"{role}: expected one manifest row for {source_name!r}"
                  )
              published = matches[0]
              materialized = source_path.exists()
              observed = None
              digest_match = None
              if materialized:
                  observed = hashlib.sha256(source_path.read_bytes()).hexdigest()
                  digest_type = str(published.get("digestType", "")).lower().replace("-", "")
                  if digest_type != "sha256":
                      raise SystemExit(
                          f"{role}: unsupported published digest type {published.get('digestType')!r}"
                      )
                  digest_match = observed.lower() == str(
                      published.get("digest", "")
                  ).lower()
                  mismatch = mismatch or not digest_match

              rows.append(
                  {
                      "role": role,
                      "source_name": source_name,
                      "materialized": materialized,
                      "published_digest_type": published.get("digestType"),
                      "published_digest": published.get("digest"),
                      "observed_sha256": observed,
                      "digest_match": digest_match,
                  }
              )

          out = {
              "schema": "adaptive-gain-villavicencio-source-digest-verification-v1",
              "checks": rows,
              "all_materialized_sources_match_published_digest": not mismatch,
          }
          Path("artifact/source_digest_verification.json").write_text(
              json.dumps(out, indent=2) + "\n",
              encoding="utf-8",
          )
          if mismatch:
              raise SystemExit("materialized source bytes disagree with published Dryad digest")
          PY

      - name: Freeze raw checksums and locate available source files
        shell: bash
        run: |
          set -euo pipefail

          XLSX="$(find source/traits -type f -name 'plant_pollinator_data.xlsx' -print -quit || true)"
          if test -n "$XLSX"; then
            sha256sum "$XLSX" > artifact/traits_xlsx_sha256.txt
            cp "$XLSX" artifact/raw/plant_pollinator_data.xlsx
            printf '%s\n' "$XLSX" > artifact/traits_path.txt
          else
            echo "trait bytes not materialized; anonymous Dryad manifest retained"               > artifact/traits_xlsx_sha256.txt
          fi

          RDATA="$(find source/response -type f -name 'miele-JAE.RData' -print -quit || true)"
          if test -n "$RDATA"; then
            sha256sum "$RDATA" > artifact/response_rdata_sha256.txt
            cp "$RDATA" artifact/raw/miele-JAE.RData
            printf '%s\n' "$RDATA" > artifact/response_path.txt
          else
            echo "response bytes not materialized; anonymous Dryad manifest retained"               > artifact/response_rdata_sha256.txt
          fi

      - name: Export 18-network response surface when bytes are available
        shell: bash
        run: |
          set -euo pipefail
          if test -f artifact/response_path.txt; then
            RDATA="$(cat artifact/response_path.txt)"
            Rscript examples/export_villavicencio_subseasons.R "$RDATA" artifact/export
            test "$(($(wc -l < artifact/export/period_index.csv) - 1))" -eq 18
          else
            echo "18-network export skipped: published bytes not authorized in this run"               > artifact/export/README_SKIPPED.txt
          fi

      - name: Inventory trait workbook when bytes are available
        shell: bash
        run: |
          set -euo pipefail
          if ! test -f artifact/traits_path.txt; then
            printf '%s\n'               '{"schema":"adaptive-gain-villavicencio-workbook-inventory-v1","materialized":false,"model_fitted":false}'               > artifact/workbook_inventory.json
            exit 0
          fi

          python -m pip install openpyxl
          XLSX="$(cat artifact/traits_path.txt)"
          python - "$XLSX" <<'PY'
          import json
          import sys
          from pathlib import Path

          from openpyxl import load_workbook

          path = Path(sys.argv[1])
          wb = load_workbook(path, read_only=True, data_only=False)

          sheets = []
          for ws in wb.worksheets:
              first_rows = []
              for row in ws.iter_rows(
                  min_row=1,
                  max_row=min(ws.max_row, 5),
                  values_only=True,
              ):
                  first_rows.append(
                      [None if value is None else str(value) for value in row]
                  )
              sheets.append(
                  {
                      "title": ws.title,
                      "max_row": ws.max_row,
                      "max_column": ws.max_column,
                      "first_rows": first_rows,
                  }
              )

          out = {
              "schema": "adaptive-gain-villavicencio-workbook-inventory-v1",
              "materialized": True,
              "workbook": path.name,
              "sheet_count": len(sheets),
              "sheets": sheets,
              "model_fitted": False,
          }
          Path("artifact/workbook_inventory.json").write_text(
              json.dumps(out, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run annual detection-sensitive Stage-1 fallback
        shell: bash
        run: |
          set -euo pipefail
          if ! test -f artifact/traits_path.txt; then
            printf '%s\n' \
              '{"schema":"adaptive-gain-villavicencio-annual-stage1-fallback-v1","materialized":false,"analysis_status":"skipped_no_verified_workbook"}' \
              > artifact/annual_stage1_detection_sensitive.json
            exit 0
          fi

          XLSX="$(cat artifact/traits_path.txt)"
          python -m pip install -e .
          python examples/villavicencio_annual_stage1_from_xlsx.py \
            "$XLSX" \
            --output artifact/annual_stage1_detection_sensitive.json \
            --dyad-output artifact/annual_stage1_dyads.csv

          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("artifact/annual_stage1_detection_sensitive.json").read_text(
                  encoding="utf-8"
              )
          )
          if result["transition_count"] != 5:
              raise SystemExit("annual fallback did not produce exactly five transitions")
          if result["decision_equivalence_inferred"] is not False:
              raise SystemExit("annual fallback must not infer decision equivalence")
          if result["presence_basis"] != "observed_positive_links":
              raise SystemExit("annual fallback presence basis changed unexpectedly")
          join = result["join_audit"]
          if join["unmatched_observed_plant_count"] != 0:
              raise SystemExit("annual plant codes do not fully join to plant_names")
          if join["unmatched_observed_pollinator_count"] != 0:
              raise SystemExit("annual pollinator codes do not fully join to insect_names")
          PY

      - name: Reconstruct 18 subseasons from raw dated records
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifact/raw_subseason
          python examples/reconstruct_villavicencio_subseasons_from_raw.py \
            artifact/figshare/raw/visits_2006-2011_data.csv \
            artifact/figshare/raw/plant_names.csv \
            artifact/figshare/raw/insect_names.csv \
            artifact/raw_subseason

          python examples/build_villavicencio_transition_pairs.py \
            artifact/raw_subseason/raw_subseason_period_map.csv \
            artifact/raw_subseason/raw_subseason_transitions.csv

          python examples/villavicencio_stage1_from_csv.py \
            artifact/raw_subseason/raw_subseason_interactions_long.csv \
            artifact/raw_subseason/raw_subseason_transitions.csv \
            --output artifact/raw_subseason/raw_subseason_stage1.json \
            --dyad-output artifact/raw_subseason/raw_subseason_stage1_dyads.csv

          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(
              Path("artifact/raw_subseason/raw_subseason_reconstruction_summary.json").read_text(
                  encoding="utf-8"
              )
          )
          result = json.loads(
              Path("artifact/raw_subseason/raw_subseason_stage1.json").read_text(
                  encoding="utf-8"
              )
          )
          gate = json.loads(
              Path("validation/villavicencio_raw_subseason_reconstruction_gate_v1.json").read_text(
                  encoding="utf-8"
              )
          )

          if summary["period_count"] != 18 or not summary["all_periods_nonempty"]:
              raise SystemExit("raw subseason reconstruction did not produce 18 nonempty periods")
          if result["primary_transition_count"] != 12:
              raise SystemExit("raw subseason Stage-1 did not produce 12 primary transitions")
          if result["decision_equivalence_inferred"] is not False:
              raise SystemExit("raw subseason Stage-1 inferred decision equivalence")
          estimability = result["primary_estimability"]
          if estimability["transitions_with_both_outcomes"] != 12:
              raise SystemExit("not every within-year subseason transition has changed and unchanged dyads")
          if estimability["eligible_dyad_row_count"] <= 0 or estimability["changed_count"] <= 0:
              raise SystemExit("raw subseason response is degenerate")
          if summary["published_rdata_bytes_used"]:
              raise SystemExit("raw subseason reconstruction unexpectedly used RData bytes")
          if "does not by itself establish true species presence" not in gate["claim_ceiling"]:
              raise SystemExit("raw subseason gate lost claim ceiling")

          print(
              json.dumps(
                  {
                      "primary_transitions": result["primary_transition_count"],
                      "eligible_dyad_rows": estimability["eligible_dyad_row_count"],
                      "changed": estimability["changed_count"],
                      "gain": estimability["gain_count"],
                      "loss": estimability["loss_count"],
                      "both_outcome_transitions": estimability["transitions_with_both_outcomes"],
                      "undated_positive_rows": summary["undated_positive_rows"],
                      "undated_positive_visits": summary["undated_positive_visits"],
                      "annual_completeness": summary["annual_completeness"],
                  },
