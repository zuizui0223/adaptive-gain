      - name: Summarize exported periods before response analysis
        shell: bash
        run: |
          set -euo pipefail
          if test -f artifact/export/period_index.csv; then
            python - <<'PY'
          import csv
          import json
          from collections import Counter
          from pathlib import Path

          period_index = list(
              csv.DictReader(
                  Path("artifact/export/period_index.csv").open(
                      newline="",
                      encoding="utf-8-sig",
                  )
              )
          )
          interactions = list(
              csv.DictReader(
                  Path("artifact/export/subseason_interactions_long.csv").open(
                      newline="",
                      encoding="utf-8-sig",
                  )
              )
          )
          counts = Counter(row["period"] for row in interactions)
          weights = Counter()
          for row in interactions:
              weights[row["period"]] += float(row["weight"])

          summary = {
              "schema": "adaptive-gain-villavicencio-period-inventory-v1",
              "period_count": len(period_index),
              "periods": [
                  {
                      "source_index": int(row["source_index"]),
                      "period": row["period"],
                      "positive_link_rows": counts[row["period"]],
                      "total_weight": weights[row["period"]],
                  }
                  for row in period_index
              ],
              "transition_mapping_verified": False,
              "response_model_fitted": False,
          }
          Path("artifact/period_inventory.json").write_text(
              json.dumps(summary, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          else
            printf '%s\n'               '{"schema":"adaptive-gain-villavicencio-period-inventory-v1","materialized":false,"transition_mapping_verified":false,"response_model_fitted":false}'               > artifact/period_inventory.json
          fi

