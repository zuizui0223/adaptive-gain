name: floral-stage46-original-bee-Zenodo-zip-diagnostic
on:
  push:
    branches: [analysis/floral-visual-bombus-sdm-source-stage46-20261116]
    paths:
      - 'research/floral_visual_macro_stage46/diagnose_zenodo_zip.py'
      - '.github/workflows/floral-stage46-Zenodo-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-zenodo-source-access:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Diagnose original Zenodo 126MB source ZIP HTTP status without downloading
        working-directory: research/floral_visual_macro_stage46
        run: python -u diagnose_zenodo_zip.py
      - uses: actions/upload-artifact@v4
        with:
          name: stage46-original-zenodo-global-bee-range-http-access-diagnostic
          path: research/floral_visual_macro_stage46/stage46_zip_diag/*.json
          if-no-files-found: error
