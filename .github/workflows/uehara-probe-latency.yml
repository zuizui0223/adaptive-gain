name: uehara-probe-latency

on:
  push:
    branches:
      - theory/opportunity-fitness-process-v1
    paths:
      - scripts/analyze_uehara_probe_latency.py
      - tests/test_uehara_probe_latency.py
      - biology/UEHARA_2026_INDIVIDUAL_LATENCY_AUDIT_V1.md
      - .github/workflows/uehara-probe-latency.yml

jobs:
  latency-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e . pytest openpyxl
      - name: Test latency parser
        run: python -m pytest -q tests/test_uehara_probe_latency.py
