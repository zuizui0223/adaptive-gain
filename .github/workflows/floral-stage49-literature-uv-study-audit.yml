name: floral-stage49-original-published-uv-study-workbook-source-audit
on:
  push:
    branches: [analysis/floral-literature-uv-taxonomic-atlas-stage49-20261116]
    paths:
      - 'research/floral_visual_macro_stage49/**'
      - '.github/workflows/floral-stage49-literature-uv-study-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authentic-original-UV-species-workbook-index:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Source-free genuine-XLSX and fail-closed 403 tests
        working-directory: research/floral_visual_macro_stage49
        run: python -m unittest -v test_probe_original_published_uv_workbooks
      - name: Audit original publicly published Dryad UV-workbook metadata and worksheet structure
        working-directory: research/floral_visual_macro_stage49
        run: python -u probe_original_published_uv_workbooks.py
      - uses: actions/upload-artifact@v4
        with:
          name: stage49-original-published-UV-taxa-workbook-schema
          path: research/floral_visual_macro_stage49/stage49_source_receipts/*.json
          if-no-files-found: error
          retention-days: 90
