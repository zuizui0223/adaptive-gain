name: routing-tpb-copy-once
on:
  push:
    branches:
      - submission/routing-paper-tpb-v1
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: submission/routing-paper-tpb-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build TPB manuscript copy
        shell: python
        run: |
          from pathlib import Path
          src = Path('routing_paper/MANUSCRIPT_V0.md').read_text()
          replacements = [
              ('## 1. Introduction', '## Keywords\n\npopulation genetics; genotype–phenotype map; weak mutation; stationary distribution; routing representation; mutation–selection balance\n\n## 1. Introduction'),
              ('Thus a unique fully adapted state is adjacent, in phenotype space, to a gain class represented by seven states.', 'Thus a unique fully adapted state is adjacent, in phenotype space, to a gain class represented by seven states (Figure 1).'),
              ('Theorems 3 and 4 define two ordered transitions. Full gain can already be the largest aggregate class while remaining a minority of the stationary distribution.', 'Theorems 3 and 4 define two ordered transitions. Full gain can already be the largest aggregate class while remaining a minority of the stationary distribution (Figure 2).'),
              ('This comparison is not offered as a discovery of representation dependence in general. Its role is to show that the routing thresholds are conditional consequences of a specified genotype-policy representation.', 'This comparison is not offered as a discovery of representation dependence in general. Its role is to show that the routing thresholds are conditional consequences of a specified genotype-policy representation (Figure 3A).'),
              ('Accordingly, raw multiplicity is the relevant abundance factor only under the symmetric neutral-measure assumption used by Theorems 1–4.', 'Accordingly, raw multiplicity is the relevant abundance factor only under the symmetric neutral-measure assumption used by Theorems 1–4 (Figure 3B).'),
          ]
          for old, new in replacements:
              if src.count(old) != 1:
                  raise SystemExit(f'expected exactly one occurrence: {old!r}; got {src.count(old)}')
              src = src.replace(old, new)
          Path('routing_paper/tpb/TPB_MANUSCRIPT_V1.md').write_text(src)
      - name: Verify TPB insertions
        run: |
          grep -F '## Keywords' routing_paper/tpb/TPB_MANUSCRIPT_V1.md
          grep -F '(Figure 1).' routing_paper/tpb/TPB_MANUSCRIPT_V1.md
          grep -F '(Figure 2).' routing_paper/tpb/TPB_MANUSCRIPT_V1.md
          grep -F '(Figure 3A).' routing_paper/tpb/TPB_MANUSCRIPT_V1.md
          grep -F '(Figure 3B).' routing_paper/tpb/TPB_MANUSCRIPT_V1.md
      - name: Commit TPB manuscript copy
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add routing_paper/tpb/TPB_MANUSCRIPT_V1.md
          git diff --cached --quiet && exit 0
          git commit -m '[routing-paper] Assemble TPB manuscript copy'
          git push origin HEAD:submission/routing-paper-tpb-v1
