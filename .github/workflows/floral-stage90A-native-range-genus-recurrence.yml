name: Stage90A true GIFT-native WCVP species range recurrence and mode within-genus support

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/floral_macro_stage90/authentic_GIFT_native_range_breadth_and_genus_support.py"
      - "research/floral_macro_stage90/test_authentic_GIFT_native_range_breadth_and_genus_support.py"
      - ".github/workflows/floral-stage90A-native-range-genus-recurrence.yml"

permissions:
  contents: read
  actions: read

jobs:
  original-source-native-species-phylogeny-support:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Source-free GIFT native range/genus weighting guards
        run: python -m unittest discover -s research/floral_macro_stage90 -p "test_authentic_GIFT_native_range_breadth_and_genus_support.py" -v
      - name: Restore independently verified public GIFT stable v3.2 native source 5,770 modes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/zuizui0223/island/actions/artifacts/10332810251/zip" \
            -o stage90_original_GIFT32_source.zip
          echo "074a52323ba835201043a3a5980cc2b2d0ff79878e83bc9be19511ae83a1c0e8  stage90_original_GIFT32_source.zip" | sha256sum -c
      - name: Restore 59,369 original botanically documented NHM plant texts and exact source SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44051561567 \
            --repo zuizui0223/adaptive-gain \
            --name stage68-NHM-original-botanical-TEXT-59k-traits-no-photo-no-UV \
            --dir stage90_original_NHM
          echo "b81ab96a2883e2b2e7f254a9e7ab62a34afaa0dfe62f0062d1677ba852dc686a  stage90_original_NHM/combined/original_NHM_text_traits_compact.csv" | sha256sum -c
      - name: Restore original Kew WCVP 2026 native taxonomy and region source
        run: |
          mkdir -p stage90_original_Kew
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 1200 \
            "https://sftp.kew.org/pub/data-repositories/WCVP/wcvp.zip" \
            -o stage90_original_Kew/wcvp.zip
          echo "d32ea2b3a85e489b14e83bcc9eae7274532e1d113753f7be290d4b2dfde573fa  stage90_original_Kew/wcvp.zip" | sha256sum -c
      - name: Restore independent original 367×3 GIFT mode×hue output for exact regression tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14485554038/zip" \
            -o stage90_original_Stage89_GIFT32_native_367.zip
          echo "26ffa12c78a583743735d89575b6b8d4c4066a01da5b2a7e54aea531915bb7a8  stage90_original_Stage89_GIFT32_native_367.zip" | sha256sum -c
      - name: Count actual unique species and genera, 367 regional range repetitions, exact family; reweight original floras
        run: |
          python -u research/floral_macro_stage90/authentic_GIFT_native_range_breadth_and_genus_support.py \
            --GIFT32-source-artifact stage90_original_GIFT32_source.zip \
            --NHM-original stage90_original_NHM/combined/original_NHM_text_traits_compact.csv \
            --WCVP-original stage90_original_Kew/wcvp.zip \
            --Stage89-derived-artifact stage90_original_Stage89_GIFT32_native_367.zip \
            --outdir stage90_true_original_global_source_range_weight
      - name: Verify original range recurrence, exact prior Stage89 source hue and no claimed phylogenetic transitions
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          root=Path("stage90_true_original_global_source_range_weight")
          d=json.loads((root/"stage90_source_native_range_breadth_genus_support_receipt.json").read_text())
          assert d["original_source_global_TDWG_regions"]==367
          assert d["original_WCVP_native_source_flora_species"]==55775
          assert d["source_GIFT32_mode_assigned_species"]==3172
          assert d["source_mode_arm_range_and_hue_support"]["wind"]["original_native_source_distinct_species"]==612
          assert d["source_mode_arm_range_and_hue_support"]["animal"]["original_native_source_distinct_species"]==2560
          assert d["source_original_prior_367x3_GIFT_hue_fractions_all_reproduced"]
          assert d["this_range_weighting_is_NOT_a_phylogenetic_model"]
          x=list(csv.DictReader((root/"stage90_original_367_TDWG_GIFT_modes_inverse_native_range_hues.csv").open()))
          assert len(x)==734
          assert len({r["TDWG_L3"] for r in x})==367
          assert all(r["pollination_mode"] in ("animal","wind") for r in x)
          print("STAGE90A_REAL_INVERSE_BREADTH_SOURCE_3172_GLOBAL_MODE_GENUS_CHECK",{
              "genera_both":d["source_genera_with_both_animal_and_wind_modes"],
              "genera_both_hue":d["source_genera_with_both_modes_and_explicit_hue_in_both"]})
          PY
      - name: Publish only derived regional breadth-weighted summaries and count of real cross-mode genera
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage90A-original-55775-native-GIFT3172-inverse-range-genus-support
          path: stage90_true_original_global_source_range_weight/
          retention-days: 90
          if-no-files-found: warn
