name: sharp-opportunity-envelope

on:
  push:
    branches:
      - theory/opportunity-fitness-process-v1
    paths:
      - adaptive_gain/bounded_arity_extremal_bounds.py
      - adaptive_gain/opportunity_extremal_envelope.py
      - tests/test_bounded_arity_extremal_bounds.py
      - tests/test_opportunity_extremal_envelope.py
      - .github/workflows/sharp-opportunity-envelope.yml

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e . pytest
      - name: Focused tests
        run: >-
          python -m pytest -q
          tests/test_bounded_arity_extremal_bounds.py
          tests/test_opportunity_extremal_envelope.py
