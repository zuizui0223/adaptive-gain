name: floral-stage77-WORLDCLIM-WIND-Bombus-VISUAL-macro-54study

on:
  push:
    branches: [analysis/floral-bombus-visual-wind-climate-path-stage77-20261118]
    paths:
      - "research/floral_macro_stage77/**"
      - ".github/workflows/floral-stage77-real-worldclim-wind-bombus-path.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original-WorldClim-EuPPollNet-wind-macro:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original gridded climatology reader and arrays
        run: |
          python -m pip install "numpy>=1.26,<3" "rasterio>=1.3,<2"
      - name: Run anti-pseudoreplication and original date/wind semantics tests
        run: |
          python -m unittest discover \
            -s research/floral_macro_stage77 \
            -p 'test_assemble_source_worldclim_wind_climate_sites.py' -v
      - name: Download authoritative WorldClim 2.1 monthly WIND Tavg PREC VAPR and SRAD
        run: |
          set -euo pipefail
          mkdir -p stage77_original_worldclim
          for var in wind tavg prec vapr srad; do
            curl --fail --location --retry 3 --retry-all-errors \
              --connect-timeout 30 --max-time 1000 \
              "https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_10m_$var.zip" \
              -o "stage77_original_worldclim/wc2.1_10m_$var.zip"
            test -s "stage77_original_worldclim/wc2.1_10m_$var.zip"
            sha256sum "stage77_original_worldclim/wc2.1_10m_$var.zip" \
              | tee -a stage77_original_worldclim/worldclim_original_source_digest_sha256.txt
          done
          python - <<'PY'
          import zipfile
          from pathlib import Path
          base=Path("stage77_original_worldclim")
          for var in ("wind","tavg","prec","vapr","srad"):
              with zipfile.ZipFile(base/f"wc2.1_10m_{var}.zip") as a:
                  paths=[x for x in a.namelist() if x.endswith(".tif")]
              assert len(paths)==12,(var,len(paths),paths[:5])
              print("STAGE77_WORLDCLIM_REAL_MONTHLY_ORIGINAL_GEOTIFFS",var,len(paths),paths[:2])
          PY
      - name: Real source 623476 actual corrected plant-pollinator visits at site/year/month
        run: |
          python -u research/floral_macro_stage77/assemble_source_worldclim_wind_climate_sites.py \
            --worldclim-source-dir stage77_original_worldclim \
            --outdir stage77_original_real_worldclim_networks
      - name: Verify real-world source 54 studies and 1864 visit networks before modelling
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path("stage77_original_real_worldclim_networks")
          s=json.loads((p/"original_source_WorldClim_wind_climate_1864_site_matching_receipt.json").read_text())
          assert s["source_corrected_plant_visitation_record_count"]==623476
          assert s["source_study_network_year_count"]==1864
          assert s["source_source_study_ID_count"]==54
          assert s["original_pollinator_month_and_geography_audit"]["source_networks_with_multiple_source_coordinates"]==6
          assert s["site_climate_coverage"]["source_all_networks"]==1864
          assert s["climate_is_longterm_normal_NOT_coincident_original_visit_weather"]
          assert s["VOC_emissions_and_same_site_scent_not_measured_here"]
          assert not s["causal_visual_scent_wind_path_or_mediation_fitted"]
          assert not s["climate_effects_on_Bombus_vs_flower_colour_estimated"]
          with (p/"original_1864_network_sites_worldclim_wind_climate_normals.csv").open() as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==1864
          assert all(r["source_observed_no_Bombus_not_biological_absence"]=="True" for r in rows)
          print("STAGE77_REAL_EUPPOLLNET_WORLDCLIM_WIND_T_PREC_VAPR_RAD_SITE_COVERAGE",{
            "source_rows":s["original_pollinator_month_and_geography_audit"],
            "climate_coverage":s["site_climate_coverage"],
            "original_WorldClim_source_real_sha256":{
                 var:x["original_public_10m_zip_sha256"] for var,x
                 in s["original_WorldClim_source_zip_manifest"].items()
                 if var!="_source_summary"},
            "sample_real_site_wind_normal_values":[{
                "study":r["Study_id"],"network":r["Network_id"],
                "annual_wind":r["WorldClim1970_2000_annual_mean_wind_speed_m_s"],
                "month_wind":r["WorldClim1970_2000_observed_month_mean_wind_speed_m_s"],
                "source_months":r["source_observed_visit_months"],
              } for r in rows[:5]],
          })
          PY
      - name: Upload only derived study/site-climate annual and observed-month coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage77-ORIGINAL-WORLDCLIM-WIND-54study-1864-field-sites-vs-Bombus
          path: stage77_original_real_worldclim_networks/
          retention-days: 90
          if-no-files-found: warn
