name: Floral Stage81B true Ohashi 28 floral age x part raw spectral metrics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/floral_macro_stage81/extract_real_ohashi_age_spectral_28.py"
      - "research/floral_macro_stage81/test_extract_real_ohashi_age_spectral_28.py"
      - ".github/workflows/floral-stage81B-real-age-spectral-macro.yml"

permissions:
  contents: read
  actions: read

jobs:
  true-source-28-taxonomic-measured-age-spectra:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original XLS and quantitative libraries
        run: python -m pip install "numpy==2.3.5" "xlrd==2.0.2"
      - name: Run source-free tests first
        run: python -m unittest discover -s research/floral_macro_stage81 -p "test_extract_real_ohashi_age_spectral_28.py" -v
      - name: Restore exact original 28 names and full archive SHA locked by Stage79D
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44241602748 \
            --repo zuizui0223/adaptive-gain \
            --name stage79d-2015-Ohashi219-spectrometer-original-ZIP-directory-coverage \
            --dir stage81b_original_source_prior
          test -s stage81b_original_source_prior/original_ohashi_2015_zipped_219_spectrum_folder_species_EuPP_overlap.json
      - name: Download full genuine author archive and quantify 28 distinct original species
        run: |
          python -u research/floral_macro_stage81/extract_real_ohashi_age_spectral_28.py \
            --stage79d-overlap stage81b_original_source_prior/original_ohashi_2015_zipped_219_spectrum_folder_species_EuPP_overlap.json \
            --outdir stage81b_true_original_source_28_spectra
      - name: Upload only derived source metrics and reproducibility receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage81b-28-true-age-part-spectral-macro-derived
          path: stage81b_true_original_source_28_spectra/
          retention-days: 90
          if-no-files-found: warn
