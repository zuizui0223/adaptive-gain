name: routing-figure-build-once
on:
  push:
    branches: [figures/routing-paper-v1]
permissions:
  contents: write
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[figure-build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: figures/routing-paper-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Generate figures
        run: python routing_paper/figures/generate_figures.py
      - name: Validate SVG outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          expected = [
              'figure1_multiplicity.svg',
              'figure2_mode_majority.svg',
              'figure3_scope_controls.svg',
          ]
          root = Path('routing_paper/figures')
          for name in expected:
              p = root / name
              assert p.exists(), name
              text = p.read_text(encoding='utf-8')
              assert text.startswith('<svg') or '<svg' in text[:500]
              assert text.rstrip().endswith('</svg>')
              assert len(text) > 1000
          f2 = (root/'figure2_mode_majority.svg').read_text(encoding='utf-8')
          assert '7' in f2
          assert 'majority' in f2.lower()
          print('validated', *(str(root/x) for x in expected))
          PY
      - name: Commit generated SVGs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add routing_paper/figures/*.svg
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m '[figure-build] Generate routing paper SVG figures'
            git push origin HEAD:figures/routing-paper-v1
          fi
