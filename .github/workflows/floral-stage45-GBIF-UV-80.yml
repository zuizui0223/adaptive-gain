name: floral-stage45-source-UV-taxa-GBIF-coverage
on:
  push:
    branches: [analysis/floral-visual-bombus-macro-stage45-20261116]
    paths:
      - 'research/floral_visual_macro_stage45/gbif_taxon_occurrence_seed.py'
      - 'research/floral_visual_macro_stage45/test_gbif_taxon_occurrence_seed.py'
      - '.github/workflows/floral-stage45-GBIF-UV-80.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-verified-80-UV-taxa-GBIF-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: PDF source reader
        run: python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.3'
      - name: Mock-only strict taxon matching and missingness safety QA
        working-directory: research/floral_visual_macro_stage45
        run: python -m unittest -v test_gbif_taxon_occurrence_seed
      - name: Original 2021 UV PDF and GBIF exact accepted species index coverage
        working-directory: research/floral_visual_macro_stage45
        run: python -u gbif_taxon_occurrence_seed.py
      - name: Verify all source UV groups remain and missing GBIF is not absence
        working-directory: research/floral_visual_macro_stage45
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,json
          p=Path('stage45_gbif_uv_taxa')
          x=json.loads((p/'source_GBIF_taxonomic_coverage.json').read_text())
          assert x['status']=='ORIGINAL_UV_80_GBIF_TAXONOMY_AND_OCCURRENCE_COVERAGE_AUDIT'
          assert x['original_uv_taxa']==80
          assert x['uv_patterned_taxa_in_source']==26
          assert x['unresolved_taxa_never_encoded_as_absences']
          assert x['GBIF_counts_not_species_distribution_predictions']
          assert x['GBIF_counts_not_native_occurrence_not_visitation_not_independent_individuals']
          assert x['no_Bombus_joint_distribution_sdm_test_yet']
          with (p/'GBIF_matched_original_80_UV_taxa.csv').open() as h:
              rows=list(csv.DictReader(h))
          assert len(rows)==80
          assert all(r['not_native_distribution_or_predicted_suitability']=='True' for r in rows)
          assert all(r['georeferenced_occurrence_count']!='0'
              for r in rows if r['gbif_taxonomy_status']=='UNRESOLVED_SOURCE_NAME')
          print('STAGE45_REAL_GBIF_TAXONOMY_AND_GEOREFERENCE_COVERAGE_SUCCESS',x['taxonomy_statuses'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage45-GBIF-real-source-80-UV-plant-taxonomy-coverage
          path: research/floral_visual_macro_stage45/stage45_gbif_uv_taxa/*
          if-no-files-found: error
