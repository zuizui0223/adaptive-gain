name: novelty-modality-wording-fix

on:
  push:
    branches:
      - theory/routing-second-paper-novelty-boundary

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: theory/routing-second-paper-novelty-boundary
      - name: Correct genotype-mode versus layer-mode wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('theory/ROUTING_SECOND_PAPER_NOVELTY_BOUNDARY_V1.md')
          text = p.read_text()
          replacements = {
              'the full-gain routing genotype is a modal layer if and only if':
                  'the full-gain layer has maximal aggregate stationary mass among gain layers if and only if',
              'a sharp condition for when the unique full-gain genotype becomes a stationary **mode** despite the combinatorial mass of lower-gain genotypes.':
                  'a sharp condition for when the full-gain layer becomes the stationary **modal gain layer by aggregate mass** despite the combinatorial mass of lower-gain genotypes.',
              'the full adaptive phase becomes a stationary mode exactly when selection tilt crosses the sharp architecture-dependent threshold `2^k - 1`.':
                  'the full-gain class becomes the stationary modal gain layer by aggregate mass exactly when selection tilt crosses the sharp architecture-dependent threshold `2^k - 1`.',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one occurrence: {old!r}; found {text.count(old)}')
              text = text.replace(old, new)
          marker = 'Thus the threshold is exact and sharp, not a local or asymptotic criterion.\n'
          insertion = marker + (
              '\nImportant distinction: this is a threshold for the **aggregated stationary mass of gain layers**, '
              'not for the most-probable individual genotype. Under the symmetric tilt with `theta > 1`, '
              'the unique full-gain genotype already has higher per-genotype probability than any lower-gain '
              'genotype; `2^k-1` appears only after summing over the multiplicity of every genotype within a gain layer.\n'
          )
          if text.count(marker) != 1:
              raise SystemExit('mode-threshold marker not unique')
          text = text.replace(marker, insertion)
          p.write_text(text)
          PY
      - name: Commit correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add theory/ROUTING_SECOND_PAPER_NOVELTY_BOUNDARY_V1.md
          git commit -m "Clarify aggregate layer modality threshold"
          git push origin HEAD:theory/routing-second-paper-novelty-boundary
