name: floral-stage54-original-multimodal-literature-supplement-discovery
on:
  push:
    branches: [analysis/floral-multimodal-literature-atlas-stage54-20261116]
    paths:
      - research/floral_visual_macro_stage54/**
      - .github/workflows/floral-stage54-multimodal-original-discovery.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-published-visual-colour-change-and-clade-source:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install table and PDF source-layout reader
        run: python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.3'
      - name: No-invented-negatives source schema and metadata safety QA
        working-directory: research/floral_visual_macro_stage54
        run: python -m unittest -v test_probe_multimodal_original_literature
      - name: Query genuine article supplementary files, spectral archive, and phylogenies
        working-directory: research/floral_visual_macro_stage54
        run: python -u probe_multimodal_original_literature.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage54-original-151-219-51clades-supplement-source-manifest
          path: research/floral_visual_macro_stage54/stage54_multimodal_source_receipts/*.json
          if-no-files-found: error
          retention-days: 90
