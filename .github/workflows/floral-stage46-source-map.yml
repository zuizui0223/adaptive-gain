name: floral-stage46-original-Bombus-global-predicted-map
on:
  push:
    branches: [analysis/floral-visual-bombus-sdm-source-stage46-20261116]
    paths:
      - 'research/floral_visual_macro_stage46/plot_source_filtered_bombus_hex.py'
      - 'research/floral_visual_macro_stage46/test_plot_source_filtered_bombus_hex.py'
      - '.github/workflows/floral-stage46-source-map.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-filtered-bombus-world-map:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install map plotting dependencies
        run: python -m pip install --disable-pip-version-check matplotlib
      - name: Offline map provenance and coverage guards
        working-directory: research/floral_visual_macro_stage46
        run: python -m unittest -v test_plot_source_filtered_bombus_hex
      - name: Reproduce source original species and hex eligibility table
        working-directory: research/floral_visual_macro_stage46
        run: python -u author_tree_filtered_bombus.py
      - name: Render the real original source spatial Bombus model
        working-directory: research/floral_visual_macro_stage46
        run: python -u plot_source_filtered_bombus_hex.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage46-original-source-filtered-global-Bombus-hex-map-PNG-SVG
          path: |
            research/floral_visual_macro_stage46/stage46_paper_filtered_Bombus/global_Bombus_source_filtered_predicted_hex_richness.png
            research/floral_visual_macro_stage46/stage46_paper_filtered_Bombus/global_Bombus_source_filtered_predicted_hex_richness.svg
          if-no-files-found: error
          retention-days: 90
