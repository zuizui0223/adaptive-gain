name: poms-matched-flower-time
on:
  push:
    paths:
      - 'research/poms_external/matched_flower_time.py'
      - 'research/poms_external/test_matched_flower_time.py'
      - '.github/workflows/poms-matched-flower-time.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-poms-two-flower-two-month-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned quantitative dependencies
        run: python -m pip install 'numpy==2.2.6' 'pandas==2.2.3' 'scipy==1.15.3'
      - name: Check exact null and no-pseudoreplication gates
        working-directory: research/poms_external
        run: python -m unittest -v test_matched_flower_time
      - name: Run real UK PoMS data with site block and flower exposure audit
        run: python -u research/poms_external/matched_flower_time.py --out poms_matched_results
      - name: Archive numerical receipt, original SHA256 and exclusions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poms-matched-flower-time-real-results
          path: poms_matched_results/summary.json
          if-no-files-found: warn
          retention-days: 90
