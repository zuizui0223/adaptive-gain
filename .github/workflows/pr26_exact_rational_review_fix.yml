name: pr26-exact-rational-review-fix

on:
  push:
    branches:
      - fix/pr26-exact-rational-type-errors

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr26-exact-rational-type-errors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact-rational contract fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {old!r}; found {text.count(old)}")
              p.write_text(text.replace(old, new))

          Path('adaptive_gain/_exact_rational.py').write_text('''"""Shared exact-rational input validation for exact routing calculations."""\nfrom __future__ import annotations\n\nfrom fractions import Fraction\n\n\ndef as_exact_fraction(value: Fraction | int, *, name: str) -> Fraction:\n    """Return an exact Fraction, rejecting floats and non-declared numeric types.\n\n    The routing population modules intentionally use exact rational arithmetic.\n    Accepting a float would either lose exactness or leak an opaque stdlib error\n    from ``Fraction(value, 1)``.  Bool is also rejected even though it subclasses\n    int, matching the explicit integer validators elsewhere in the routing stack.\n    """\n\n    if isinstance(value, Fraction):\n        return value\n    if type(value) is int:\n        return Fraction(value, 1)\n    if isinstance(value, float):\n        raise TypeError(\n            f"{name} must be Fraction or int; float breaks exact rational arithmetic"\n        )\n    raise TypeError(f"{name} must be Fraction or int for exact rational arithmetic")\n''')

          # PR20 origin-fixation layer inherited by the PR26 stack.
          path = 'adaptive_gain/routing_origin_fixation.py'
          replace_once(path,
              'from typing import Iterable\n',
              'from typing import Iterable\n\nfrom ._exact_rational import as_exact_fraction\n')
          replace_once(path,
              'def _as_fraction(value: Fraction | int) -> Fraction:\n    result = value if isinstance(value, Fraction) else Fraction(value, 1)\n    if result < 1:\n',
              'def _as_fraction(value: Fraction | int) -> Fraction:\n    result = as_exact_fraction(value, name="fitness_step")\n    if result < 1:\n')
          replace_once(path,
              '    r = relative_fitness if isinstance(relative_fitness, Fraction) else Fraction(relative_fitness, 1)\n    if r <= 0:\n',
              '    r = as_exact_fraction(relative_fitness, name="relative_fitness")\n    if r <= 0:\n')
          # The same old line occurs in moran_fixation_ratio after the first replacement.
          replace_once(path,
              '    r = relative_fitness if isinstance(relative_fitness, Fraction) else Fraction(relative_fitness, 1)\n    if r <= 0:\n',
              '    r = as_exact_fraction(relative_fitness, name="relative_fitness")\n    if r <= 0:\n')
          replace_once(path,
              '    tilt = theta if isinstance(theta, Fraction) else Fraction(theta, 1)\n    if tilt <= 0:\n',
              '    tilt = as_exact_fraction(theta, name="theta")\n    if tilt <= 0:\n')
          replace_once(path,
              '    tilt = theta if isinstance(theta, Fraction) else Fraction(theta, 1)\n    if tilt <= 0:\n',
              '    tilt = as_exact_fraction(theta, name="theta")\n    if tilt <= 0:\n')

          # PR24 representation layer.
          path = 'adaptive_gain/routing_representation_dependence.py'
          replace_once(path,
              'from fractions import Fraction\n',
              'from fractions import Fraction\n\nfrom ._exact_rational import as_exact_fraction\n')
          replace_once(path,
              'def _as_positive_fraction(value: Fraction | int, name: str) -> Fraction:\n    result = value if isinstance(value, Fraction) else Fraction(value, 1)\n    if result <= 0:\n',
              'def _as_positive_fraction(value: Fraction | int, name: str) -> Fraction:\n    result = as_exact_fraction(value, name=name)\n    if result <= 0:\n')

          # PR26 reversible-certificate layer.
          path = 'adaptive_gain/routing_reversible_certificate.py'
          replace_once(path,
              'from fractions import Fraction\n',
              'from fractions import Fraction\n\nfrom ._exact_rational import as_exact_fraction\n')
          replace_once(path,
              'def _as_fraction(value: Fraction | int) -> Fraction:\n    return value if isinstance(value, Fraction) else Fraction(value, 1)\n',
              'def _as_fraction(value: Fraction | int, *, name: str) -> Fraction:\n    return as_exact_fraction(value, name=name)\n')
          replace_once(path,
              '    proposal = tuple(tuple(_as_fraction(p) for p in row) for row in certificate.proposal)\n',
              '    proposal = tuple(\n        tuple(_as_fraction(p, name="proposal probability") for p in row)\n        for row in certificate.proposal\n    )\n')
          replace_once(path,
              '    mu = tuple(_as_fraction(w) for w in certificate.neutral_measure)\n',
              '    mu = tuple(_as_fraction(w, name="neutral_measure weight") for w in certificate.neutral_measure)\n')
          replace_once(path, '    a = _as_fraction(fitness_step)\n', '    a = _as_fraction(fitness_step, name="fitness_step")\n')
          # theta occurs twice in the public tilt helpers.
          replace_once(path, '    tilt = _as_fraction(theta)\n', '    tilt = _as_fraction(theta, name="theta")\n')
          replace_once(path, '    tilt = _as_fraction(theta)\n', '    tilt = _as_fraction(theta, name="theta")\n')

          # PR26 mutation-bias layer.
          path = 'adaptive_gain/routing_mutation_bias_nonidentifiability.py'
          replace_once(path,
              'from typing import Iterable\n',
              'from typing import Iterable\n\nfrom ._exact_rational import as_exact_fraction\n')
          replace_once(path,
              'def _as_fraction(value: Fraction | int) -> Fraction:\n    return value if isinstance(value, Fraction) else Fraction(value, 1)\n',
              'def _as_fraction(value: Fraction | int, *, name: str) -> Fraction:\n    return as_exact_fraction(value, name=name)\n')
          replace_once(path,
              '    weights = tuple(_as_fraction(value) for value in values)\n',
              '    weights = tuple(_as_fraction(value, name="target_distribution weight") for value in values)\n')
          # theta appears in three public functions.
          for _ in range(3):
              replace_once(path, '    tilt = _as_fraction(theta)\n', '    tilt = _as_fraction(theta, name="theta")\n')
          replace_once(path,
              '    scale = _as_fraction(edge_scale)\n',
              '    scale = _as_fraction(edge_scale, name="edge_scale")\n')

          Path('tests/test_exact_rational_input_contract.py').write_text('''from fractions import Fraction\n\nimport pytest\n\nfrom adaptive_gain.routing_mutation_bias_nonidentifiability import (\n    neutral_measure_for_target_selected_distribution,\n    normalize_positive_distribution,\n)\nfrom adaptive_gain.routing_origin_fixation import (\n    full_phase_is_modal_layer,\n    full_phase_stationary_mass_from_tilt,\n    moran_fixation_probability,\n    routing_fitness,\n)\nfrom adaptive_gain.routing_representation_dependence import (\n    compressed_full_phase_mass_from_tilt,\n)\nfrom adaptive_gain.routing_reversible_certificate import (\n    ReversibleMutationCertificate,\n    selected_layer_distribution_from_tilt,\n)\n\n\ndef _simple_certificate() -> ReversibleMutationCertificate:\n    return ReversibleMutationCertificate(\n        gains=(0, 1),\n        proposal=((Fraction(1, 2), Fraction(1, 2)), (Fraction(1, 2), Fraction(1, 2))),\n        neutral_measure=(Fraction(1, 2), Fraction(1, 2)),\n        start_state=0,\n    )\n\n\n@pytest.mark.parametrize(\n    "call",\n    [\n        lambda: routing_fitness(1, (0, 0), 1.5),\n        lambda: moran_fixation_probability(1.5, 4),\n        lambda: full_phase_is_modal_layer(3, 1.5),\n        lambda: full_phase_stationary_mass_from_tilt(3, 1.5),\n        lambda: compressed_full_phase_mass_from_tilt(2, 1.5),\n        lambda: selected_layer_distribution_from_tilt(_simple_certificate(), 1.5),\n        lambda: neutral_measure_for_target_selected_distribution((1, 1), 1.5),\n        lambda: normalize_positive_distribution((1, 0.5)),\n    ],\n)\ndef test_float_inputs_fail_with_explicit_exact_arithmetic_message(call):\n    with pytest.raises(TypeError, match=r"Fraction or int; float breaks exact rational arithmetic"):\n        call()\n\n\ndef test_bool_is_not_silently_accepted_as_integer():\n    with pytest.raises(TypeError, match=r"theta must be Fraction or int"):\n        full_phase_is_modal_layer(2, True)\n\n\ndef test_fraction_and_int_inputs_remain_exact_and_supported():\n    assert full_phase_is_modal_layer(1, 3) is True\n    assert full_phase_stationary_mass_from_tilt(1, Fraction(3, 2)) == Fraction(1, 3)\n    assert moran_fixation_probability(Fraction(3, 2), 4) == Fraction(27, 65)\n''')
          PY
      - name: Run full test suite
        run: python -m pytest -q
      - name: Commit review fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add adaptive_gain tests
          git commit -m "Make exact rational input contract explicit"
          git push origin HEAD:fix/pr26-exact-rational-type-errors
