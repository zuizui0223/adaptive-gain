name: stage12-wind-heterospecific-mode-source
on:
  push:
    branches: [analysis/wind-community-mode-stage12-20261030]
    paths:
      - 'research/wind_mode_stage12/**'
      - '.github/workflows/stage12-wind-heterospecific-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-grain:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed source-audit dependencies
        run: python -m pip install 'numpy==2.2.6' 'pandas==2.2.3' 'scipy==1.15.3' 'statsmodels==0.14.6'
      - name: Test survey-grain and insect source join with synthetic cases
        working-directory: research/wind_mode_stage12
        run: python -m unittest test_source_qa test_model -v
      - name: Fetch actual source and match provider SHA256 before parsing
        run: python -u research/wind_reward_stage11/source_gate.py --out stage12_original
      - name: Audit source survey movement categories and insect community records without effect estimation
        run: python -u research/wind_mode_stage12/source_qa.py --out stage12_original
      - name: Fit one frozen wind-by-nonhoneybee-share movement-mode association on original surveys
        run: python -u research/wind_mode_stage12/model.py --out stage12_original
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage12-source-grain-receipts
          path: |
            stage12_original/source_receipt.json
            stage12_original/source_grain_qa.json
            stage12_original/original_count_diagnostics.json
            stage12_original/stage12_mode_cohort.csv
            stage12_original/stage12_mode_interaction_result.json
          if-no-files-found: warn
          retention-days: 90
