name: Stage113 authentic 72 contact-free mainland ERA5-model 1991-2020 point gust source frame

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/floral_macro_stage113/**"
      - ".github/workflows/floral-stage113-original-mainland72-ERA5-point-source.yml"
      - "docs/FLORAL_STAGE113_MAINLAND72_ORIGINAL_ERA5_POINT_SOURCE_20261121.md"

permissions:
  contents: read
  actions: read

jobs:
  real-ERA5-model-72-contactfree-mainland-train-point-weather:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original Stage87 TDWG GIS verification dependencies
        run: python -m pip install "numpy==2.3.5" "shapely==2.1.2" "rasterio==1.4.3"
      - name: Validate exactly frozen 33 prior plus 39 new train and 37 source holdout closed
        run: python -m unittest discover -s research/floral_macro_stage113 -p "test_*.py" -v
      - name: Restore original Stage94 mainland 125 88/37 pre-contact TDWG3 source geography (SHA pinned)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/zuizui0223/adaptive-gain/actions/artifacts/14529576121/zip" \
            -o stage113_original_stage94_mainland_source.zip
          echo "3475b544d0530e5dfa71b6324f80055d98971d1a3c364309596a381ea025d833  stage113_original_stage94_mainland_source.zip" | sha256sum -c
      - name: Restore original outcome-blind 72 contact-free train, unchanged 37 holdout geographic frame
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/zuizui0223/adaptive-gain/actions/artifacts/14537927849/zip" \
            -o stage113_original_stage98B_contactfree72.zip
          echo "8026b800672cad2afd97e2fe416349cc3aca8f650e78ae8c001dd31de104c8b7  stage113_original_stage98B_contactfree72.zip" | sha256sum -c
      - name: Restore authentic first original 25 mainland 30-year ERA5-model climate point sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/zuizui0223/adaptive-gain/actions/artifacts/14535045199/zip" \
            -o stage113_original_stage95C_first25.zip
          echo "7c98421306466b589b1f80ec97d4ca32ba58e73ba7807f0c2330a7f082fe6b67  stage113_original_stage95C_first25.zip" | sha256sum -c
      - name: Restore authentic next original 25 mainland 30-year ERA5-model climate point sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/zuizui0223/adaptive-gain/actions/artifacts/14539061901/zip" \
            -o stage113_original_stage97_next25.zip
          echo "5e5ee1c325cc85abfb3cfb98a85d9b3faecacd116db9d917eaebdd3a0c453d79  stage113_original_stage97_next25.zip" | sha256sum -c
      - name: Restore original signed TDWG Level3 boundaries with immutable Git blob identity
        run: |
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 30 --max-time 900 \
            "https://raw.githubusercontent.com/tdwg/wgsrpd/master/geojson/level3.geojson" \
            -o stage113_original_TDWG3.geojson
          python - <<'PY'
          import hashlib
          data=open("stage113_original_TDWG3.geojson","rb").read()
          assert hashlib.sha1(("blob "+str(len(data))+"\0").encode()+data).hexdigest()=="91104e5159e31f88154833a51d3b0d1c9271083f"
          PY
      - name: Acquire actual missing 39 of 72 source-original train-point ERA5 MODEL 30-year daily max wind gust and 2m T
        run: |
          python -u research/floral_macro_stage113/fill_remaining39_original_mainland72_ERA5_model_point_daily.py \
            --original-stage94-geo-ZIP stage113_original_stage94_mainland_source.zip \
            --original-TDWG3-geojson stage113_original_TDWG3.geojson \
            --original-stage98B-train72-ZIP stage113_original_stage98B_contactfree72.zip \
            --original-stage95C-first25-ZIP stage113_original_stage95C_first25.zip \
            --original-stage97-next25-ZIP stage113_original_stage97_next25.zip \
            --outdir stage113_derived
      - name: Assert actual full 72 original source point climates (NOT area wind, not floral effect, holdout unopened)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("stage113_derived/stage113_TRUE_72_original_mainland_ERA5model_1991_2020_point_climate_NO_floral.json")
          d=json.loads(p.read_text())
          assert d["source_original_stage98B_72_37_SHA256"]=="8026b800672cad2afd97e2fe416349cc3aca8f650e78ae8c001dd31de104c8b7"
          assert d["source_first50_existing_33_train_points_reused"]==33
          assert d["source_new_39_original_train_points_ERA5_model_30years"]==39
          assert d["source_final_72_original_mainland_exploration_gust15_POINT_regions"]==72
          assert d["source_original17_geographic_blocks"]==17
          assert d["source_1991_2020_complete_days_per_site"]==10958
          assert len(d["source_original_API_request_sha256_ledger_for_new39"])==24
          assert len({x["source_raw_provider_JSON_SHA256"] for x in d["source_original_API_request_sha256_ledger_for_new39"]})==24
          assert len(d["source_72_true_original_model_ERA5_representative_points"])==72
          assert len({x["TDWG_L3"] for x in d["source_72_true_original_model_ERA5_representative_points"]})==72
          assert all(x["source_ERA5_observed_30yr_days"]==10958 for x in d["source_72_true_original_model_ERA5_representative_points"])
          assert d["source_original_37_holdout_floral_outcomes_NOT_read"]
          assert d["source_37_holdout_weather_records_NOT_USED_OR_REPORTED"]
          assert d["source_72_area_weighted_gust_NOT_obtained"]
          assert d["source_real_Public_OpenMeteo_ERA5model_daily_not_CDS_hourly_10fg"]
          assert d["source_NHM_WFO_AusTraits_Bombus_outcomes_NOT_read"]
          print("STAGE113_REAL_72_EXPLORATION_ERA5MODEL_SOURCE_POINTS",{
             "original_reused":33,"new_source":39,"blocks":17,
             "gust15_min":d["source_point_gust15_min_excluding_eligibility_NA"],
             "gust15_max":d["source_point_gust15_max_excluding_eligibility_NA"],
             "nonmissing":d["source_point_gust15_nonmissing_original_regions"],
             "NO_flora_or_holdout_results":True})
          PY
      - name: Publish only genuine point-source ERA5-model calendar/JSON SHA receipts (partial groups clearly labelled)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage113-original-72-contactfree-mainland-ERA5model-30y-source-points-only
          path: stage113_derived/
          if-no-files-found: warn
          retention-days: 90
