name: bee-stage22-four-leaf-bit-confusion-math
on:
  push:
    branches: [theory/bee-asymmetric-leaf-errors-stage22-20261114]
    paths:
      - 'research/bee_leaf_asym_stage22/**'
      - '.github/workflows/bee-stage22-four-leaf-confusion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-four-leaf-bit-channels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test exact joint-mass source against independent normalized-posterior oracle
        working-directory: research/bee_leaf_asym_stage22
        run: PYTHONPATH=../bee_leaf_noise_stage21:. python -m unittest test_leaf_bit_confusion -v
      - name: Generate source-free four-class leaf error decision frontier
        working-directory: research/bee_leaf_asym_stage22
        run: PYTHONPATH=../bee_leaf_noise_stage21:. python -u leaf_bit_confusion.py --out stage22_exact_outputs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage22-only-theory-four-leaf-bit-confusion
          path: research/bee_leaf_asym_stage22/stage22_exact_outputs/stage22_four_leaf_errors_math.json
          if-no-files-found: warn
          retention-days: 90
